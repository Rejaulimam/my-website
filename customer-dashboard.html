<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Dashboard - RK Store</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            color: #333;

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: #ff6600;

            color: white;

            padding: 18px;

            text-align: center;

        }


        .header h1 {

            margin: 0;

        }


        .header p {

            margin: 6px 0 0;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 92%;

            max-width: 700px;

            margin: 25px auto;

        }


        /* =========================
           LOADING
        ========================= */

        #loading {

            text-align: center;

            color: #666;

            padding: 30px;

        }


        /* =========================
           CARD
        ========================= */

        .card {

            background: white;

            padding: 20px;

            margin-bottom: 18px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

        }


        .card h2 {

            margin-top: 0;

            color: #333;

        }


        /* =========================
           CUSTOMER INFORMATION
        ========================= */

        .customer-name {

            font-size: 20px;

            font-weight: bold;

            color: #ff6600;

            margin-bottom: 8px;

        }


        .customer-email {

            color: #555;

            word-break: break-word;

        }


        /* =========================
           MENU
        ========================= */

        .menu-title {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 15px;

            color: #333;

        }


        .menu-button {

            display: block;

            width: 100%;

            padding: 14px;

            margin-bottom: 10px;

            border: none;

            border-radius: 6px;

            background: #ff6600;

            color: white;

            font-size: 16px;

            cursor: pointer;

            text-align: left;

        }


        .menu-button:hover {

            background: #e65c00;

        }


        /* =========================
           STATUS BUTTONS
        ========================= */

        .pending-button {

            background: #f0ad00;

        }


        .pending-button:hover {

            background: #d99a00;

        }


        .shipped-button {

            background: #1976d2;

        }


        .shipped-button:hover {

            background: #125ca8;

        }


        .delivered-button {

            background: #27ae60;

        }


        .delivered-button:hover {

            background: #1f8c4d;

        }


        /* =========================
           SHOPPING
        ========================= */

        .shopping-button {

            background: #ff6600;

        }


        /* =========================
           LOGOUT
        ========================= */

        .logout {

            background: #d32f2f;

        }


        .logout:hover {

            background: #b71c1c;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {

                width: 94%;

            }

            .card {

                padding: 17px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>RK Store</h1>

        <p>
            Customer Dashboard
        </p>

    </div>



    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">


        <!-- LOADING -->

        <div id="loading">

            Checking login...

        </div>



        <!-- DASHBOARD -->

        <div
            id="dashboardContent"
            style="display:none;"
        >


            <!-- =========================
                 CUSTOMER INFORMATION
            ========================= -->

            <div class="card">

                <h2>
                    Welcome 👋
                </h2>


                <div
                    id="customerName"
                    class="customer-name"
                >
                    Customer
                </div>


                <div
                    id="customerEmail"
                    class="customer-email"
                >
                </div>

            </div>



            <!-- =========================
                 MY ORDERS
            ========================= -->

            <div class="card">

                <div class="menu-title">

                    📦 My Orders

                </div>


                <button
                    class="menu-button"
                    onclick="viewOrders()"
                >

                    📦 View All Orders

                </button>


                <button
    class="menu-button pending-button"
    onclick="viewPendingOrders()"
>
    🟡 Pending Orders
</button>


<button
    class="menu-button confirmed-button"
    onclick="viewConfirmedOrders()"
>
    ✅ Confirmed Orders
</button>


                <button
    class="menu-button shipped-button"
    onclick="viewShippedOrders()"
>
    🚚 Shipped Orders
</button>


                <button
    class="menu-button delivered-button"
    onclick="viewDeliveredOrders()"
>
    ✅ Delivered Orders
</button>

            </div>



            <!-- =========================
                 SHOPPING
            ========================= -->

            <div class="card">

                <div class="menu-title">

                    🛍️ Shopping

                </div>


                <p>

                    Continue shopping at
                    RK Store.

                </p>


                <button
                    class="menu-button shopping-button"
                    onclick="goHome()"
                >

                    🛍️ Continue Shopping

                </button>

            </div>



            <!-- =========================
                 LOGOUT
            ========================= -->

            <div class="card">

                <button
                    class="menu-button logout"
                    onclick="logout()"
                >

                    🚪 Logout

                </button>

            </div>


        </div>

    </div>



<script type="module">


    /* ==================================================
       FIREBASE
    ================================================== */


    import {

        initializeApp

    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {

        getAuth,

        onAuthStateChanged,

        signOut

    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



    /* ==================================================
       FIREBASE CONFIG
    ================================================== */


    const firebaseConfig = {

        apiKey:
            "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

        authDomain:
            "rk-store-5fb24.firebaseapp.com",

        projectId:
            "rk-store-5fb24",

        storageBucket:
            "rk-store-5fb24.firebasestorage.app",

        messagingSenderId:
            "407275549697",

        appId:
            "1:407275549697:web:41043b49bf7182cecffc00"

    };



    /* ==================================================
       INITIALIZE FIREBASE
    ================================================== */


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);



    /* ==================================================
       CHECK CUSTOMER LOGIN
    ================================================== */


    onAuthStateChanged(

        auth,

        function(user) {


            console.log(
                "Dashboard Auth:",
                user
            );


            /* =========================
               CUSTOMER LOGGED IN
            ========================= */

            if (user) {


                document
                    .getElementById(
                        "loading"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "dashboardContent"
                    )
                    .style.display =
                    "block";



                /* =========================
                   CUSTOMER NAME
                ========================= */


                document
                    .getElementById(
                        "customerName"
                    )
                    .innerText =

                    "Hello, " +

                    (
                        user.displayName ||
                        "Customer"
                    ) +

                    "!";



                /* =========================
                   CUSTOMER EMAIL
                ========================= */


                document
                    .getElementById(
                        "customerEmail"
                    )
                    .innerText =

                    "Email: " +

                    (
                        user.email ||
                        ""
                    );


            }


            /* =========================
               NOT LOGGED IN
            ========================= */

            else {


                setTimeout(

                    function() {


                        if (
                            !auth.currentUser
                        ) {


                            window.location.href =
                                "customer-login.html";


                        }

                    },

                    3000

                );

            }

        }

    );



    /* ==================================================
       VIEW ORDERS
    ================================================== */


    window.viewOrders =

        function() {


            window.location.href =
                "customer-orders.html";


        };


/* ==================================================
   PENDING ORDERS
================================================== */

window.viewPendingOrders =

    function() {

        window.location.href =
            "customer-orders.html?status=Pending";

    };


/* ==================================================
   SHIPPED ORDERS
================================================== */

window.viewShippedOrders =

    function() {

        window.location.href =
            "customer-orders.html?status=Shipped";

    };


/* ==================================================
   DELIVERED ORDERS
================================================== */

window.viewDeliveredOrders =

    function() {

        window.location.href =
            "customer-orders.html?status=Delivered";

    };



    /* ==================================================
       CONTINUE SHOPPING
    ================================================== */


    window.goHome =

        function() {


            window.location.href =
                "index.html";


        };



    /* ==================================================
       LOGOUT
    ================================================== */


    window.logout =

        async function() {


            try {


                await signOut(
                    auth
                );


                window.location.href =
                    "customer-login.html";


            }

            catch (error) {


                console.error(

                    "Logout Error:",

                    error

                );


            }

        };


</script>


</body>
</html>
