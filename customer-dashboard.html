<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard - RK Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #ff6600;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 6px 0 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-top: 0;
            color: #333;
        }

        .customer-email {
            color: #555;
            word-break: break-word;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #ff6600;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e65c00;
        }

        .logout {
            background: #d32f2f;
        }

        .logout:hover {
            background: #b71c1c;
        }

        #loading {
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="header">

        <h1>RK Store</h1>

        <p>Customer Dashboard</p>

    </div>


    <div class="container">

        <div id="loading">
            Checking login...
        </div>


        <div id="dashboardContent" style="display:none;">

            <div class="card">

                <h2>Welcome 👋</h2>

                <p id="customerName">
                    Customer
                </p>

                <p id="customerEmail"
                   class="customer-email">
                </p>

            </div>


            <div class="card">

                <h2>📦 My Orders</h2>

                <p>
                    View your orders and order details.
                </p>

                <button onclick="viewOrders()">
                    View My Orders
                </button>

            </div>


            <div class="card">

                <h2>🏠 Shopping</h2>

                <p>
                    Continue shopping at RK Store.
                </p>

                <button onclick="goHome()">
                    Continue Shopping
                </button>

            </div>


            <div class="card">

                <button
                    class="logout"
                    onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

    </div>


    <script type="module">

        /* =========================
           FIREBASE
        ========================= */

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

            authDomain:
                "rk-store-5fb24.firebaseapp.com",

            projectId:
                "rk-store-5fb24",

            storageBucket:
                "rk-store-5fb24.firebasestorage.app",

            messagingSenderId:
                "407275549697",

            appId:
                "1:407275549697:web:41043b49bf7182cecffc00"

        };


        /* =========================
           INITIALIZE
        ========================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        /* =========================
           CHECK CUSTOMER LOGIN
        ========================= */

        onAuthStateChanged(
            auth,
            function(user) {

                console.log(
                    "Dashboard Auth:",
                    user
                );


                if (user) {

                    document
                        .getElementById("loading")
                        .style.display = "none";


                    document
                        .getElementById("dashboardContent")
                        .style.display = "block";


                    document
    .getElementById("customerName")
    .innerText =
    "Hello, " + (user.displayName || "Customer") + "!";


                    document
                        .getElementById("customerEmail")
                        .innerText =
                        "Email: " + user.email;

                }

                else {

                    /*
                       Give Firebase time
                       to restore the session.
                    */

                    setTimeout(
                        function() {

                            if (!auth.currentUser) {

                                window.location.href =
                                    "customer-login.html";

                            }

                        },
                        3000
                    );

                }

            }
        );


        /* =========================
           MY ORDERS
        ========================= */

        window.viewOrders =
            function() {

                window.location.href =
                    "customer-orders.html";

            };


        /* =========================
           SHOPPING
        ========================= */

        window.goHome =
            function() {

                window.location.href =
                    "index.html";

            };


        /* =========================
           LOGOUT
        ========================= */

        window.logout =
            async function() {

                try {

                    await signOut(auth);

                    window.location.href =
                        "customer-login.html";

                }

                catch (error) {

                    console.error(
                        "Logout Error:",
                        error
                    );

                }

            };

    </script>

</body>
</html>
