<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RK Store - My Orders</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            background: #ff6600;
            color: white;
            text-align: center;
            padding: 18px;
            margin: 0;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 25px auto;
        }


        /* =========================
           MY ORDERS DROPDOWN
        ========================= */

        .order-filter {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px #ccc;
        }

        .order-filter-label {
            display: block;
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 8px;
        }

        #orderStatusFilter {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        /*
         * Cancelled option
         * লাল রঙ
         */

        #orderStatusFilter option[value="Cancelled"] {
            color: #e53935;
            font-weight: bold;
        }


        /* =========================
           ORDER
        ========================= */

        .order {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px #ccc;
        }

        .order h2 {
            color: #ff6600;
            margin-top: 0;
        }

        .product {
            border-top: 1px solid #ddd;
            padding: 10px 0;
        }


        /* =========================
           STATUS COLORS
        ========================= */

        .status {
            font-weight: bold;
            color: #ff6600;
        }

        .status.pending {
            color: #f39c12;
        }

        .status.confirmed {
            color: #3498db;
        }

        .status.shipped {
            color: #9b59b6;
        }

        .status.delivered {
            color: #27ae60;
        }

        .status.cancelled {
            color: #e53935;
        }


        /* =========================
           LOADING / NO ORDERS
        ========================= */

        .loading,
        .no-orders,
        .login-message {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 8px;
        }

        .login-btn {
            display: inline-block;
            background: #ff6600;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
        }

    </style>

</head>

<body>

<h1>RK Store - My Orders</h1>


<div class="container">


    <!-- =========================
         MY ORDERS DROPDOWN
         ========================= -->

    <div class="order-filter">

        <label
            class="order-filter-label"
            for="orderStatusFilter"
        >
            My Orders ▼
        </label>


        <select
            id="orderStatusFilter"
            onchange="filterMyOrders()"
        >

            <option value="All">
                📦 View All Orders
            </option>


            <option value="Pending">
                🟡 Pending Orders
            </option>


            <option value="Confirmed">
                ✅ Confirmed Orders
            </option>


            <option value="Shipped">
                🚚 Shipped Orders
            </option>


            <option value="Delivered">
                ✅ Delivered Orders
            </option>


            <option
                value="Cancelled"
            >
                ❎ Cancelled Orders
            </option>

        </select>

    </div>


    <!-- =========================
         ORDERS CONTAINER
         ========================= -->

    <div
        id="ordersContainer"
    >

        <div class="loading">

            Checking customer login...

        </div>

    </div>

</div>


<script type="module">


import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

    authDomain:
        "rk-store-5fb24.firebaseapp.com",

    projectId:
        "rk-store-5fb24",

    storageBucket:
        "rk-store-5fb24.firebasestorage.app",

    messagingSenderId:
        "407275549697",

    appId:
        "1:407275549697:web:41043b49bf7182cecffc00"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const auth =
    getAuth(app);


/* =========================
   CUSTOMER ORDERS
========================= */


let myOrders = [];


/* =========================
   LOAD CUSTOMER ORDERS
========================= */


async function loadMyOrders(user) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    try {

        const snapshot =
            await getDocs(
                collection(db, "orders")
            );


        /*
         * আগের মতোই customer ID
         * দিয়ে শুধু নিজের order নেওয়া হবে
         */

        myOrders = [];


        snapshot.forEach(
            (docSnapshot) => {

                const order =
                    docSnapshot.data();


                if (
                    order.customerId === user.uid
                ) {

                    myOrders.push({

                        ...order,

                        firebaseId:
                            docSnapshot.id

                    });

                }

            }
        );


        /* =========================
           NO ORDERS
        ========================= */


        if (
            myOrders.length === 0
        ) {

            container.innerHTML = `

                <div class="no-orders">

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        You have not placed any orders yet.
                    </p>

                    <a
                        class="login-btn"
                        href="index.html"
                    >
                        Continue Shopping
                    </a>

                </div>

            `;

            return;

        }


        /*
         * প্রথমবার সব order দেখাবে
         */

        displayOrders("All");


    } catch (error) {

        console.error(
            "My Orders Error:",
            error
        );


        container.innerHTML = `

            <div class="no-orders">

                <h2>
                    Orders Could Not Be Loaded
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}


/* =========================
   FILTER MY ORDERS
========================= */


window.filterMyOrders =
    function() {


        const filter =
            document.getElementById(
                "orderStatusFilter"
            );


        const selectedStatus =
            filter.value;


        displayOrders(
            selectedStatus
        );

    };


/* =========================
   DISPLAY ORDERS
========================= */


function displayOrders(
    selectedStatus
) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    /*
     * View All Orders
     */

    let filteredOrders;


    if (
        selectedStatus === "All"
    ) {

        filteredOrders =
            myOrders;

    } else {

        /*
         * নির্দিষ্ট Status অনুযায়ী
         * order filter
         */

        filteredOrders =
            myOrders.filter(
                (order) => {

                    const status =
                        order.status ||
                        "Pending";


                    return (
                        status ===
                        selectedStatus
                    );

                }
            );

    }


    /* =========================
       NO MATCHING ORDERS
    ========================= */


    if (
        filteredOrders.length === 0
    ) {

        let message =
            "No orders found.";


        if (
            selectedStatus ===
            "Pending"
        ) {

            message =
                "You have no Pending Orders.";

        }


        if (
            selectedStatus ===
            "Confirmed"
        ) {

            message =
                "You have no Confirmed Orders.";

        }


        if (
            selectedStatus ===
            "Shipped"
        ) {

            message =
                "You have no Shipped Orders.";

        }


        if (
            selectedStatus ===
            "Delivered"
        ) {

            message =
                "You have no Delivered Orders.";

        }


        if (
            selectedStatus ===
            "Cancelled"
        ) {

            message =
                "You have no Cancelled Orders.";

        }


        container.innerHTML = `

            <div class="no-orders">

                <h2>
                    No Orders Found
                </h2>

                <p>
                    ${message}
                </p>

            </div>

        `;

        return;

    }


    let html = "";


    /* =========================
       CREATE ORDER HTML
    ========================= */


    filteredOrders.forEach(
        (order) => {


            let productsHTML = "";


            /* =========================
               PRODUCTS
            ========================= */


            if (
                order.products &&
                order.products.length > 0
            ) {

                order.products.forEach(
                    (product) => {


                        const price =
                            Number(
                                product.price
                            ) || 0;


                        const quantity =
                            Number(
                                product.quantity
                            ) || 1;


                        const subtotal =
                            price *
                            quantity;


                        productsHTML += `

                            <div class="product">

                                <p>

                                    <strong>
                                        Product:
                                    </strong>

                                    ${
                                        product.name ||
                                        "Product"
                                    }

                                </p>


                                <p>

                                    Price:
                                    ৳${price}

                                </p>


                                <p>

                                    Quantity:
                                    ${quantity}

                                </p>


                                <p>

                                    Subtotal:
                                    ৳${subtotal}

                                </p>

                            </div>

                        `;

                    }
                );

            }


            /* =========================
               TOTAL
            ========================= */


            const total =
                Number(
                    order.totalAmount
                ) || 0;


            /* =========================
               STATUS
            ========================= */


            const status =
                order.status ||
                "Pending";


            const statusClass =
                status.toLowerCase();


            /* =========================
               ORDER HTML
            ========================= */


            html += `

                <div class="order">

                    <h2>

                        Order ID:
                        ${order.orderId || "N/A"}

                    </h2>


                    <p>

                        <strong>
                            Date:
                        </strong>

                        ${
                            order.dateTime ||
                            "N/A"
                        }

                    </p>


                    <p>

                        <strong>
                            Status:
                        </strong>

                        <span
                            class="status ${statusClass}"
                        >

                            ${status}

                        </span>

                    </p>


                    <h3>
                        Products
                    </h3>


                    ${productsHTML}


                    <p>

                        <strong>
                            Total:
                        </strong>

                        ৳${total}

                    </p>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =========================
   CHECK CUSTOMER LOGIN
========================= */


onAuthStateChanged(
    auth,
    (user) => {

        if (user) {

            /*
             * Customer is already logged in
             */

            loadMyOrders(
                user
            );

        } else {

            /*
             * Customer is not logged in
             */

            document
                .getElementById(
                    "ordersContainer"
                )
                .innerHTML = `

                    <div class="login-message">

                        <h2>
                            Please Login
                        </h2>

                        <p>
                            Login to see your orders.
                        </p>

                        <a
                            class="login-btn"
                            href="customer-login.html"
                        >
                            Customer Login
                        </a>

                    </div>

                `;

        }

    }
);


</script>

</body>
</html>
