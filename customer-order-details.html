<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RK Store - My Order Details</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background: #ff6600;
            color: white;
            padding: 18px;
            text-align: center;
        }


        .header h1 {
            margin: 0;
        }


        .header p {
            margin: 6px 0 0;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 92%;
            max-width: 700px;
            margin: 25px auto;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }


        .back-button:hover {
            background: #222;
        }


        /* =========================
           CARD
        ========================= */

        .card {
            background: white;
            padding: 18px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }


        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff6600;
            margin-bottom: 15px;
        }


        /* =========================
           INFO
        ========================= */

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }


        .info-row:last-child {
            border-bottom: none;
        }


        .label {
            color: #777;
        }


        .value {
            font-weight: bold;
            text-align: right;
        }


        /* =========================
           PRODUCT
        ========================= */

        .product {
            border-top: 1px solid #ddd;
            padding: 15px 0;
        }


        .product:first-child {
            border-top: none;
        }


        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }


        .product p {
            margin: 6px 0;
            color: #555;
        }


        .subtotal {
            text-align: right;
            font-weight: bold;
            color: #333;
            margin-top: 8px;
        }


        /* =========================
           TOTAL
        ========================= */

        .total {
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #ddd;
            padding-top: 15px;
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }


        .total-price {
            color: #ff6600;
        }


        /* =========================
           STATUS BADGE
        ========================= */

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
        }


        /* =========================
           ORDER STATUS TIMELINE
        ========================= */

        .timeline {
            margin-top: 10px;
            position: relative;
            padding-left: 5px;
        }


        .timeline-item {
            position: relative;
            padding: 0 0 30px 45px;
            color: #999;
            font-size: 16px;
            font-weight: normal;
        }


        .timeline-item:last-child {
            padding-bottom: 0;
        }


        /* Circle */

        .timeline-item::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #ddd;
            border: 3px solid #f5f5f5;
            box-shadow: 0 0 0 2px #ddd;
            z-index: 2;
        }


        /* Connecting Line */

        .timeline-item::after {
            content: "";
            position: absolute;
            left: 13px;
            top: 21px;
            width: 3px;
            height: 38px;
            background-color: #ddd;
        }


        .timeline-item:last-child::after {
            display: none;
        }


        /* Completed */

        .timeline-item.completed {
            color: #27ae60;
            font-weight: bold;
        }


        .timeline-item.completed::before {
            background-color: #27ae60;
            box-shadow: 0 0 0 2px #27ae60;
        }


        /* Active */

        .timeline-item.active {
            color: #ff6600;
            font-weight: bold;
        }


        .timeline-item.active::before {
            background-color: #ff6600;
            box-shadow: 0 0 0 3px rgba(255,102,0,0.2);
            transform: scale(1.15);
        }


        /* Active line */

        .timeline-item.active::after {
            background-color: #ff6600;
        }


        /* =========================
           ERROR
        ========================= */

        .error {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .info-row {
                flex-direction: column;
                gap: 5px;
            }


            .value {
                text-align: left;
            }


            .total {
                font-size: 18px;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h1>RK Store</h1>

        <p>Order Details</p>

    </div>


    <div class="container">


        <button
            class="back-button"
            onclick="goBack()"
        >
            ← Back to My Orders
        </button>


        <div id="orderDetails">

            Loading order details...

        </div>


    </div>



<script type="module">


    /* =========================
       FIREBASE
    ========================= */


    import {

        initializeApp

    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {

        getFirestore,
        doc,
        getDoc

    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    import {

        getAuth,
        onAuthStateChanged

    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */


    const firebaseConfig = {

        apiKey:
            "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

        authDomain:
            "rk-store-5fb24.firebaseapp.com",

        projectId:
            "rk-store-5fb24",

        storageBucket:
            "rk-store-5fb24.firebasestorage.app",

        messagingSenderId:
            "407275549697",

        appId:
            "1:407275549697:web:41043b49bf7182cecffc00"

    };


    /* =========================
       INITIALIZE
    ========================= */


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    const auth =
        getAuth(app);


    /* =========================
       GET ORDER ID
    ========================= */


    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const orderId =
        urlParams.get("orderId");


    /* =========================
       AUTH CHECK
    ========================= */


    onAuthStateChanged(

        auth,

        async function(user) {


            if (!user) {

                window.location.href =
                    "customer-login.html";

                return;

            }


            if (!orderId) {

                showError();

                return;

            }


            await loadOrder(
                user.uid,
                orderId
            );

        }

    );


    /* =========================
       LOAD ORDER
    ========================= */


    async function loadOrder(
        customerId,
        orderId
    ) {


        const container =
            document.getElementById(
                "orderDetails"
            );


        try {


            const orderRef =
                doc(
                    db,
                    "orders",
                    orderId
                );


            const orderSnapshot =
                await getDoc(
                    orderRef
                );


            if (!orderSnapshot.exists()) {

                showError();

                return;

            }


            const order =
                orderSnapshot.data();


            /* =========================
               SECURITY CHECK
            ========================= */


            if (
                order.customerId !==
                customerId
            ) {

                showError();

                return;

            }


            /* =========================
               PRODUCTS
            ========================= */


            let productsHTML = "";

            let totalAmount = 0;


            if (
                Array.isArray(
                    order.products
                )
            ) {


                order.products.forEach(
                    function(product) {


                        const price =
                            Number(
                                product.price
                            ) || 0;


                        const quantity =
                            Number(
                                product.quantity
                            ) || 1;


                        const subtotal =
                            price *
                            quantity;


                        totalAmount +=
                            subtotal;


                        productsHTML += `

                            <div class="product">


                                <div class="product-name">

                                    ${
                                        product.name ||
                                        "Product"
                                    }

                                </div>


                                <p>

                                    Price:
                                    ৳${price}

                                </p>


                                <p>

                                    Quantity:
                                    ${quantity}

                                </p>


                                <div class="subtotal">

                                    Subtotal:
                                    ৳${subtotal}

                                </div>


                            </div>

                        `;

                    }
                );

            }


            if (!productsHTML) {

                productsHTML = `

                    <p>
                        No products found.
                    </p>

                `;

            }


            /* =========================
               ORDER STATUS
            ========================= */


            const currentStatus =
                order.status ||
                "Pending";


            const statusOrder = [

                "Pending",
                "Confirmed",
                "Shipped",
                "Delivered"

            ];


            const currentStatusIndex =
                statusOrder.indexOf(
                    currentStatus
                );


            let timelineHTML = "";


            statusOrder.forEach(
                function(status, index) {


                    let className = "";


                    if (
                        currentStatusIndex >= 0 &&
                        index < currentStatusIndex
                    ) {

                        className =
                            "completed";

                    }


                    else if (
                        index ===
                        currentStatusIndex
                    ) {

                        className =
                            "active";

                    }


                    timelineHTML += `

                        <div
                            class="timeline-item ${className}"
                        >

                            ${status}

                        </div>

                    `;

                }
            );


            /* =========================
               DISPLAY ORDER
            ========================= */


            container.innerHTML = `


                <!-- ORDER INFORMATION -->


                <div class="card">


                    <div class="card-title">

                        Order Information

                    </div>


                    <div class="info-row">

                        <span class="label">

                            Order ID

                        </span>


                        <span class="value">

                            ${
                                order.orderId ||
                                orderId
                            }

                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">

                            Order Date

                        </span>


                        <span class="value">

                            ${
                                order.dateTime ||
                                "N/A"
                            }

                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">

                            Status

                        </span>


                        <span class="value">


                            <span class="status">

                                ${currentStatus}

                            </span>


                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">

                            Status Updated

                        </span>


                        <span class="value">

                            ${
                                order.statusUpdatedTime ||
                                "Not updated"
                            }

                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">

                            Payment

                        </span>


                        <span class="value">

                            ${
                                order.paymentMethod ||
                                "N/A"
                            }

                        </span>

                    </div>


                </div>



                <!-- CUSTOMER INFORMATION -->


                <div class="card">


                    <div class="card-title">

                        Customer Information

                    </div>


                    <div class="info-row">

                        <span class="label">

                            Name

                        </span>


                        <span class="value">

                            ${
                                order.customerName ||
                                "N/A"
                            }

                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">

                            Phone

                        </span>


                        <span class="value">

                            ${
                                order.customerMobile ||
                                "N/A"
                            }

                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">

                            Address

                        </span>


                        <span class="value">

                            ${
                                order.customerAddress ||
                                "N/A"
                            }

                        </span>

                    </div>


                </div>



                <!-- ORDERED PRODUCTS -->


                <div class="card">


                    <div class="card-title">

                        Ordered Products

                    </div>


                    ${productsHTML}


                    <div class="total">


                        <span>

                            Total Amount

                        </span>


                        <span class="total-price">

                            ৳${totalAmount}

                        </span>


                    </div>


                </div>



                <!-- ORDER STATUS TIMELINE -->


                <div class="card">


                    <div class="card-title">

                        Order Status

                    </div>


                    <div class="timeline">

                        ${timelineHTML}

                    </div>


                </div>


            `;


        } catch (error) {


            console.error(

                "Order Details Error:",

                error

            );


            container.innerHTML = `

                <div class="error">

                    <h2>

                        Unable to Load Order

                    </h2>


                    <p>

                        Please try again later.

                    </p>

                </div>

            `;

        }

    }


    /* =========================
       ERROR
    ========================= */


    function showError() {


        document.getElementById(
            "orderDetails"
        ).innerHTML = `

            <div class="error">

                <h2>

                    Order Not Found

                </h2>


                <p>

                    This order could not be found.

                </p>

            </div>

        `;

    }


    /* =========================
       BACK
    ========================= */


    window.goBack =
        function() {


            window.location.href =
                "customer-orders.html";

        };


</script>


</body>
</html>
