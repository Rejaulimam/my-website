<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
    <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    h1 {
        background-color: #ff6600;
        color: white;
        text-align: center;
        padding: 20px;
        margin: 0;
    }

    .product-details {
        background-color: white;
        margin: 20px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>
<h1>Product Details</h1>

<div class="product-details">
    <img src="product1.jpg" alt="Product 1" width="250" style="border-radius: 10px;">
    <h2>Product 1</h2>
    <p>Price: ৳500</p>
    <p>This is a product from RK Store.</p>

<button id="addToCart">Add to Cart</button>
    <button>Buy Now</button>
</div>









    
<script>
    const params = new URLSearchParams(window.location.search);
    const product = params.get("product");

    if (product === "2") {
        document.querySelector("img").src = "product2.jpg";
        document.querySelector("img").alt = "Product 2";
        document.querySelector("h2").textContent = "Product 2";
        document.querySelector("p").textContent = "Price: ৳800";
    }

    if (product === "3") {
        document.querySelector("img").src = "product3.jpg";
        document.querySelector("img").alt = "Product 3";
        document.querySelector("h2").textContent = "Product 3";
        document.querySelector("p").textContent = "Price: ৳1000";
    }

    if (product === "4") {
        document.querySelector("img").src = "product4.jpg";
        document.querySelector("img").alt = "Product 4";
        document.querySelector("h2").textContent = "Product 4";
        document.querySelector("p").textContent = "Price: ৳1200";
    }
document.getElementById("addToCart").addEventListener("click", function() {

    const productName = document.querySelector("h2").textContent;
const productPriceText = document.querySelector("p").textContent;
const productPrice = parseInt(productPriceText.replace(/\D/g, ""));

    const cartItem = {
        name: productName,
        price: productPrice
    };

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push(cartItem);

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Product added to cart!");
});


</script>
</body>
</html>
