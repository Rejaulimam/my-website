<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RK Store - Product Details</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

h1 {
    background-color: #ff6600;
    color: white;
    text-align: center;
    padding: 20px;
    margin: 0;
}

/* =========================
   PRODUCT DETAILS
========================= */

.product-details {

    background-color: white;

    margin: 20px auto;

    padding: 20px;

    border-radius: 10px;

    text-align: center;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.1);

    max-width: 500px;

    width: calc(100% - 20px);
}

/* =========================
   IMAGE SLIDER
========================= */

.image-slider {

    position: relative;

    width: 100%;

    max-width: 350px;

    margin: auto;

    overflow: hidden;

    border-radius: 10px;
}

.image-slider img {

    width: 100%;

    height: 350px;

    object-fit: contain;

    display: block;

    border-radius: 10px;

    background-color: #f5f5f5;
}

/* =========================
   SLIDER BUTTONS
========================= */

.slider-button {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 40px;

    height: 40px;

    border-radius: 50%;

    border: none;

    background-color:
        rgba(0,0,0,0.5);

    color: white;

    font-size: 24px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 5;
}

.slider-button:hover {

    background-color:
        rgba(0,0,0,0.8);
}

.prev-button {
    left: 10px;
}

.next-button {
    right: 10px;
}

/* =========================
   IMAGE DOTS
========================= */

.image-dots {

    text-align: center;

    margin-top: 12px;
}

.image-dot {

    display: inline-block;

    width: 10px;

    height: 10px;

    background-color: #ccc;

    border-radius: 50%;

    margin: 4px;

    cursor: pointer;
}

.image-dot.active {

    background-color: #ff6600;

    transform: scale(1.2);
}

/* =========================
   PRODUCT NAME
========================= */

#productName {

    margin-top: 20px;

    margin-bottom: 10px;

    color: #333;
}

#productPrice {

    font-size: 20px;

    font-weight: bold;

    color: #ff6600;
}

/* =========================
   ACTION BUTTONS
========================= */

button.action-button {

    background-color: #ff6600;

    color: white;

    border: none;

    padding: 10px 15px;

    border-radius: 5px;

    margin: 5px;

    cursor: pointer;

    font-size: 15px;
}

button.action-button:hover {
    background-color: #e65c00;
}

/* =========================
   PRODUCT DESCRIPTION
========================= */

.product-description {

    margin-top: 20px;

    background-color: #ffffff;

    border: 1px solid #e0e0e0;

    border-radius: 10px;

    padding: 15px;

    text-align: left;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.08);
}

.product-description h3 {

    margin: 0 0 15px 0;

    padding-bottom: 10px;

    border-bottom: 2px solid #ff6600;

    color: #333;

    text-align: left;

    font-size: 20px;
}

.description-row {

    display: flex;

    align-items: flex-start;

    padding: 9px 0;

    border-bottom: 1px solid #eeeeee;

    font-size: 15px;

    line-height: 1.5;
}

.description-row:last-child {
    border-bottom: none;
}

.description-label {

    width: 45%;

    font-weight: bold;

    color: #333;
}

.description-value {

    width: 55%;

    color: #555;

    word-break: break-word;
}

.description-loading {

    text-align: center;

    color: #777;

    font-size: 14px;

    margin-top: 10px;
}

/* =========================
   FIREBASE NOTICE
========================= */

.firebase-updated {

    display: none;

    margin-top: 10px;

    padding: 8px;

    border-radius: 5px;

    background: #e8f5e9;

    color: #198754;

    font-size: 13px;

    text-align: center;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .product-details {

        margin: 0;

        padding: 15px;

        width: 100%;

        max-width: none;

        border-radius: 0;

        box-shadow: none;
    }

    .image-slider {
        max-width: 100%;
    }

    .image-slider img {
        height: 350px;
    }

    .slider-button {

        width: 36px;

        height: 36px;

        font-size: 21px;
    }

    .product-description {

        margin-top: 20px;

        padding: 12px;
    }

    .product-description h3 {
        font-size: 18px;
    }

    .description-row {
        font-size: 14px;
    }

    .description-label {
        width: 45%;
    }

    .description-value {
        width: 55%;
    }

}

</style>

</head>


<body>


<h1>
    Product Details
</h1>


<div class="product-details">


    <!-- =========================
         IMAGE SLIDER
    ========================= -->

    <div class="image-slider">

        <img
            id="productImage"
            src=""

        >

        <button
            type="button"

            id="prevButton"

        <button
            type="button"

    </div>


    <!-- =========================
         IMAGE DOTS
    ========================= -->

    <div
        class="image-dots"

    ></div>


    <!-- =========================
         PRODUCT INFORMATION
    ========================= -->

    <h2 id="productName">

    </h2>

    <p id="productPrice">
        Price: ৳0
    </p>

<p id="productStock" style="
    font-size:16px;
    font-weight:bold;
    margin:8px 0 15px 0;
    color:#198754;
">
    Stock: Checking...
</p>

    <p>
        This is a product from RK Store.
    </p>


    <!-- =========================
         FIREBASE NOTICE
    ========================= -->

    <div
        id="firebaseUpdated"
        class="firebase-updated"
    >

    <!-- =========================

    </button>


    <!-- =========================

    ========================= -->

    <button
        type="button"
        class="action-button"
        id="buyNow"
    >
        Buy Now
    </button>


    <!-- =========================
         PRODUCT DESCRIPTION
    ========================= -->

    <div class="product-description">

        <h3>
            Product Description
        </h3>


        <div class="description-row">

            <div class="description-label">
                Product Serial Number:
            </div>

            <div
                class="description-value"
                id="productSerial"
            >
                -
            </div>

        </div>


        <div class="description-row">

            <div class="description-label">
                Product Name:
            </div>

            <div
                class="description-value"
                id="descriptionProductName"
            >
                -
            </div>

        </div>


        <div class="description-row">

            <div class="description-label">
                Price:
            </div>

            <div
                class="description-value"
                id="descriptionProductPrice"
            >
                -
            </div>

        </div>


        <div class="description-row">

            <div class="description-label">
                Brand:
            </div>

            <div
                class="description-value"
                id="productBrand"
            >
                -
            </div>

        </div>


        <div class="description-row">

            <div class="description-label">
                Category:
            </div>

            <div
                class="description-value"
                id="productCategory"
            >
                -
            </div>

        </div>


        <div class="description-row">

            <div class="description-label">
                Color:
            </div>

            <div
                class="description-value"
                id="productColor"
            >
                -
            </div>

        </div>


        <div class="description-row">

            <div class="description-label">
                Size / Dimension:
            </div>

            <div
                class="description-value"
                id="productSize"
            >
                -
            </div>

        </div>


        <div class="description-row">

            <div class="description-label">
                Material:
            </div>

            <div
                class="description-value"
                id="productMaterial"
            >
                -
            </div>

        </div>


        <div class="description-row">

            <div class="description-label">
                Product Details:
            </div>

            <div
                class="description-value"
                id="productDetailsText"
            >
                -
            </div>

        </div>


        <div
            class="description-loading"
            id="descriptionLoading"
        ></div>

    </div>


</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

    authDomain:
        "rk-store-5fb24.firebaseapp.com",

    projectId:
        "rk-store-5fb24",

    storageBucket:
        "rk-store-5fb24.firebasestorage.app",

    messagingSenderId:
        "407275549697",

    appId:
        "1:407275549697:web:41043b49bf7182cecffc00"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* =====================================================
   GET PRODUCT NUMBER
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const productNumber =
    Number(
        params.get("product")
    );


/* =====================================================
   CHECK PRODUCT NUMBER
===================================================== */

if (
    !Number.isInteger(productNumber) ||
    productNumber < 1 ||
    productNumber > 100
) {

    showProductNotFound();

}


/* =====================================================
   AUTOMATIC PRODUCT DATA
===================================================== */

/*
   এখানে Product 1-100 আলাদা করে
   লিখতে হবে না।

   Product 3 হলে:

   product3/product1.jpg
   product3/product2.jpg
   product3/product3.jpg
   product3/product4.jpg
   product3/product5.jpg
   product3/product6.jpg

   Product 4 হলে:

   product4/product1.jpg
   product4/product2.jpg
   ...
*/


function createProductData(number) {

    const images = [];

    for (
        let i = 1;
        i <= 6;
        i++
    ) {

        images.push(
            "product" +
            number +
            "/product" +
            i +
            ".jpg"
        );

    }


    return {

    images: images,

    name:
        "Product " +
        number,

    price:
        100 +
        (number * 10),

    brand:
        "RK Store",

    category:
        "",

    color:
        "",

    size:
        "",

    material:
        "",

    details:
        "",

    stock:
        0

};

}

/* =====================================================
   DEFAULT PRODUCT INFORMATION
===================================================== */

const defaultProductInfo = {

    1: {
        name: "Men's Formal Solid Shirt",
        price: 450,
        category: "Men",
        color: "Black",
        size: "M, L, XL",
        material: "Cotton",
        details:
            "Premium quality formal shirt suitable for regular and formal use."
    },

    2: {
        name: "Men's Casual Shirt",
        price: 400,
        category: "Men",
        color: "Blue",
        size: "M, L, XL",
        material: "Cotton",
        details:
            "Comfortable casual shirt suitable for everyday use."
    },

    3: {
        name: "Men's Casual Check Shirt",
        price: 480,
        category: "Men",
        color: "Check Pattern",
        size: "M, L, XL",
        material: "Cotton",
        details:
            "Stylish checked casual shirt designed for comfortable everyday wear."
    },

    4: {
        name: "Women's Casual Yellow Dress",
        price: 500,
        category: "Women",
        color: "Yellow",
        size: "M, L, XL",
        material: "Cotton",
        details:
            "Beautiful casual yellow dress suitable for regular and casual occasions."
    },

    5: {
        name: "Women's Casual Dress",
        price: 900,
        category: "Women",
        color: "Mixed",
        size: "M, L, XL",
        material: "Cotton",
        details:
            "Comfortable women's casual dress with a stylish design for everyday use."
    }

};


/* =====================================================
   CURRENT PRODUCT
===================================================== */

let currentProduct =
    createProductData(
        productNumber
    );


/* =====================================================
   APPLY DEFAULT INFORMATION
===================================================== */

if (
    defaultProductInfo[productNumber]
) {

    currentProduct = {

        ...currentProduct,

        ...defaultProductInfo[
            productNumber
        ]

    };

}


/* =====================================================
   SLIDER VARIABLES
===================================================== */

let currentImageIndex =
    0;


let productImages =
    currentProduct.images;


/* =====================================================
   SHOW PRODUCT
===================================================== */

function showProduct(data) {

    if (!data) {

        showProductNotFound();

        return;

    }


    currentProduct =
        data;


    productImages =
        Array.isArray(
            data.images
        )
            ? data.images
            : [];


    currentImageIndex =
        0;


    /* =========================
       FIRST IMAGE
    ========================= */

    if (
        productImages.length > 0
    ) {

        const image =
            document.getElementById(
                "productImage"
            );


        image.src =
            productImages[0];


        image.alt =
            data.name ||
            "Product";


        image.onerror =
            function() {

                this.style.display =
                    "none";

            };

    }


    /* =========================
       NAME
    ========================= */

    document.getElementById(
        "productName"
    ).textContent =
        data.name ||
        "Product";


    /* =========================
       PRICE
    ========================= */

    document.getElementById(
        "productPrice"
    ).textContent =
        "Price: ৳" +
        formatPrice(
            data.price
        );

document.getElementById(
    "productStock"
).textContent =
    "Stock: " +
    (
        data.stock !== undefined
            ? data.stock
            : 0
    ) +
    " pcs";

    /* =========================
       DESCRIPTION
    ========================= */

    showDescription(
        data
    );


    /* =========================
       DOTS
    ========================= */

    createImageDots();

}


/* =====================================================
   PRICE FORMAT
===================================================== */

function formatPrice(price) {

    const number =
        Number(price);


    if (
        !Number.isFinite(number)
    ) {

        return "0";

    }


    return number.toLocaleString(
        "en-US"
    );

}


/* =====================================================
   SHOW DESCRIPTION
===================================================== */

function showDescription(data) {

    document.getElementById(
        "productSerial"
    ).textContent =
        productNumber;


    document.getElementById(
        "descriptionProductName"
    ).textContent =
        data.name || "-";


    document.getElementById(
        "descriptionProductPrice"
    ).textContent =
        "৳" +
        formatPrice(
            data.price
        );


    document.getElementById(
        "productBrand"
    ).textContent =
        data.brand || "-";


    document.getElementById(
        "productCategory"
    ).textContent =
        data.category || "-";


    document.getElementById(
        "productColor"
    ).textContent =
        data.color || "-";


    document.getElementById(
        "productSize"
    ).textContent =
        data.size || "-";


    document.getElementById(
        "productMaterial"
    ).textContent =
        data.material || "-";


    document.getElementById(
        "productDetailsText"
    ).textContent =
        data.details || "-";

}


/* =====================================================
   CREATE IMAGE DOTS
===================================================== */

function createImageDots() {

    const dotsContainer =
        document.getElementById(
            "imageDots"
        );


    dotsContainer.innerHTML =
        "";


    if (
        productImages.length === 0
    ) {

        return;

    }


    productImages.forEach(
        function(image, index) {

            const dot =
                document.createElement(
                    "span"
                );


            dot.className =
                "image-dot";


            if (
                index === 0
            ) {

                dot.classList.add(
                    "active"
                );

            }


            dot.addEventListener(
                "click",
                function() {

                    showImage(
                        index
                    );

                }
            );


            dotsContainer.appendChild(
                dot
            );

        }
    );

}


/* =====================================================
   SHOW IMAGE
===================================================== */

function showImage(index) {

    if (
        productImages.length === 0
    ) {

        return;

    }


    if (
        index < 0 ||
        index >= productImages.length
    ) {

        return;

    }


    currentImageIndex =
        index;


    const image =
        document.getElementById(
            "productImage"
        );


    image.style.display =
        "block";


    image.src =
        productImages[
            currentImageIndex
        ];


    const dots =
        document.querySelectorAll(
            ".image-dot"
        );


    dots.forEach(
        function(dot, i) {

            dot.classList.remove(
                "active"
            );


            if (
                i === currentImageIndex
            ) {

                dot.classList.add(
                    "active"
                );

            }

        }
    );

}


/* =====================================================
   NEXT IMAGE
===================================================== */

document.getElementById(
    "nextButton"
).addEventListener(
    "click",
    function() {

        if (
            productImages.length === 0
        ) {

            return;

        }


        currentImageIndex++;


        if (
            currentImageIndex >=
            productImages.length
        ) {

            currentImageIndex =
                0;

        }


        showImage(
            currentImageIndex
        );

    }
);


/* =====================================================
   PREVIOUS IMAGE
===================================================== */

document.getElementById(
    "prevButton"
).addEventListener(
    "click",
    function() {

        if (
            productImages.length === 0
        ) {

            return;

        }


        currentImageIndex--;


        if (
            currentImageIndex < 0
        ) {

            currentImageIndex =
                productImages.length - 1;

        }


        showImage(
            currentImageIndex
        );

    }
);


/* =====================================================
   MOBILE SWIPE
===================================================== */

let touchStartX =
    0;


let touchEndX =
    0;


const imageSlider =
    document.querySelector(
        ".image-slider"
    );


imageSlider.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0]
                .screenX;

    }
);


imageSlider.addEventListener(
    "touchend",
    function(event) {

        touchEndX =
            event.changedTouches[0]
                .screenX;

        handleSwipe();

    }
);


/* =====================================================
   HANDLE SWIPE
===================================================== */

function handleSwipe() {

    if (
        productImages.length <= 1
    ) {

        return;

    }


    const swipeDistance =
        touchEndX -
        touchStartX;


    /* SWIPE LEFT */

    if (
        swipeDistance < -50
    ) {

        currentImageIndex++;


        if (
            currentImageIndex >=
            productImages.length
        ) {

            currentImageIndex =
                0;

        }


        showImage(
            currentImageIndex
        );

    }


    /* SWIPE RIGHT */

    else if (
        swipeDistance > 50
    ) {

        currentImageIndex--;


        if (
            currentImageIndex < 0
        ) {

            currentImageIndex =
                productImages.length - 1;

        }


        showImage(
            currentImageIndex
        );

    }

}


/* =====================================================
   LOAD FIREBASE DESCRIPTION
===================================================== */

async function loadFirebaseDescription() {

    if (
        !Number.isInteger(productNumber) ||
        productNumber < 1 ||
        productNumber > 100
    ) {

        return;

    }


    const loading =
        document.getElementById(
            "descriptionLoading"
        );


    try {

        loading.textContent =
            "Loading latest product information...";


        const productRef =
            doc(
                db,
                "productDescriptions",
                String(productNumber)
            );


        const snapshot =
            await getDoc(
                productRef
            );


        if (
            snapshot.exists()
        ) {

            const firebaseData =
                snapshot.data();


            currentProduct = {

                ...currentProduct,

                name:
                    firebaseData.name !== undefined &&
                    String(
                        firebaseData.name
                    ).trim() !== ""

                        ? String(
                            firebaseData.name
                        )

                        : currentProduct.name,


                price:
                    firebaseData.price !== undefined &&
                    firebaseData.price !== ""

                        ? Number(
                            firebaseData.price
                        )

                        : currentProduct.price,


                brand:
                    firebaseData.brand !== undefined &&
                    String(
                        firebaseData.brand
                    ).trim() !== ""

                        ? String(
                            firebaseData.brand
                        )

                        : currentProduct.brand,


                category:
                    firebaseData.category !== undefined &&
                    String(
                        firebaseData.category
                    ).trim() !== ""

                        ? String(
                            firebaseData.category
                        )

                        : currentProduct.category,


                color:
                    firebaseData.color !== undefined &&
                    String(
                        firebaseData.color
                    ).trim() !== ""

                        ? String(
                            firebaseData.color
                        )

                        : currentProduct.color,


                size:
                    firebaseData.size !== undefined &&
                    String(
                        firebaseData.size
                    ).trim() !== ""

                        ? String(
                            firebaseData.size
                        )

                        : currentProduct.size,


                material:
                    firebaseData.material !== undefined &&
                    String(
                        firebaseData.material
                    ).trim() !== ""

                        ? String(
                            firebaseData.material
                        )

                        : currentProduct.material,


                details:
                    firebaseData.details !== undefined &&
                    String(
                        firebaseData.details
                    ).trim() !== ""

                        ? String(
                            firebaseData.details
                        )

                        : currentProduct.details,

            };


            showProduct(
                currentProduct
            );


            document.getElementById(
                "firebaseUpdated"
            ).style.display =
                "block";

        }


        loading.textContent =
            "";

    }


    catch (error) {

        console.error(
            "Firebase Description Error:",
            error
        );


        loading.textContent =
            "";

    }

}


/* =====================================================
   PRODUCT NOT FOUND
===================================================== */

function showProductNotFound() {

    document.getElementById(
        "productName"
    ).textContent =
        "Product Not Found";


    document.getElementById(
        "productPrice"
    ).textContent =
        "";


    document.getElementById(
        "productSerial"
    ).textContent =
        "-";


    document.getElementById(
        "descriptionProductName"
    ).textContent =
        "-";


    document.getElementById(
        "descriptionProductPrice"
    ).textContent =
        "-";


    document.getElementById(
        "productBrand"
    ).textContent =
        "-";


    document.getElementById(
        "productCategory"
    ).textContent =
        "-";


    document.getElementById(
        "productColor"
    ).textContent =
        "-";


    document.getElementById(
        "productSize"
    ).textContent =
        "-";


    document.getElementById(
        "productMaterial"
    ).textContent =
        "-";


    document.getElementById(
        "productDetailsText"
    ).textContent =
        "-";

}


/* =====================================================
   ADD TO CART
===================================================== */

document.getElementById(
    "addToCart"
).addEventListener(
    "click",
    function() {

        if (
            !currentProduct
        ) {

            alert(
                "Product not found!"
            );

            return;

        }


        let cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
