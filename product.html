<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
    <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    h1 {
        background-color: #ff6600;
        color: white;
        text-align: center;
        padding: 20px;
        margin: 0;
    }

    .product-details {
        background-color: white;
        margin: 20px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>
<h1>Product Details</h1>

<div class="product-details">
    <img src="product1.jpg" alt="Product 1" width="250" style="border-radius: 10px;">
    <h2>Product 1</h2>
    <p>Price: ৳500</p>
    <p>This is a product from RK Store.</p>

    <button>Add to Cart</button>
    <button>Buy Now</button>
</div>
</body>
</html>
