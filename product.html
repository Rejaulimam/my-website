<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
    <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    h1 {
        background-color: #ff6600;
        color: white;
        text-align: center;
        padding: 20px;
        margin: 0;
    }

    .product-details {
        background-color: white;
        margin: 20px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>
<h1>Product Details</h1>

<div class="product-details">
    <img src="product1.jpg" alt="Product 1" width="250" style="border-radius: 10px;">
    <h2>Product 1</h2>
    <p>Price: ৳500</p>
    <p>This is a product from RK Store.</p>

<button id="addToCart">Add to Cart</button>
<button id="buyNow">Buy Now</button>
</div>









    
<script>

    const params = new URLSearchParams(window.location.search);
    const product = params.get("product");

const productData = {
    "1": {
        image: "product1.jpg",
        name: "Product 1",
        price: "Price: ৳500"
    },
    "2": {
        image: "product2.jpg",
        name: "Product 2",
        price: "Price: ৳800"
    },
    "3": {
        image: "product3.jpg",
        name: "Product 3",
        price: "Price: ৳1000"
    },
    "4": {
        image: "product4.jpg",
        name: "Product 4",
        price: "Price: ৳1200"
    }
};

const selectedProduct = productData[product];

if (selectedProduct) {
    document.querySelector(".product-details img").src = selectedProduct.image;
    document.querySelector(".product-details img").alt = selectedProduct.name;
    document.querySelector(".product-details h2").textContent = selectedProduct.name;
    document.querySelector(".product-details p").textContent = selectedProduct.price;
}

    
document.getElementById("addToCart").addEventListener("click", function() {

    const productName = document.querySelector("h2").textContent;
const productPriceText = document.querySelector("p").textContent;
const productPrice = parseInt(productPriceText.replace(/\D/g, ""));

    const cartItem = {
    name: productName,
    price: productPrice,
    image: selectedProduct.image
};

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

const existingProduct = cart.find(
    item => item.name === cartItem.name
);

if (existingProduct) {
    existingProduct.quantity += 1;
} else {
    cartItem.quantity = 1;
    cart.push(cartItem);
}

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Product added to cart!");
});



document.getElementById("buyNow").addEventListener("click", function() {

    const productName = document.querySelector("h2").textContent;
    const productPriceText = document.querySelector("p").textContent;
    const productPrice = parseInt(productPriceText.replace(/\D/g, ""));

    const cartItem = {
    name: productName,
    price: productPrice,
    quantity: 1,
    image: selectedProduct.image
};

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const existingProduct = cart.find(
        item => item.name === cartItem.name
    );

    if (existingProduct) {
        existingProduct.quantity += 1;
    } else {
        cart.push(cartItem);
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    window.location.href = "cart.html";
});


</script>
</body>
</html>
