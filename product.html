<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RK Store - Product Details</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }


        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }


        /* =========================
           PRODUCT DETAILS
        ========================= */

        .product-details {
            background-color: white;

            margin: 20px auto;

            padding: 20px;

            border-radius: 10px;

            text-align: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

            max-width: 500px;

            width: calc(100% - 20px);
        }


        /* =========================
           IMAGE SLIDER
        ========================= */

        .image-slider {
            position: relative;

            width: 100%;

            max-width: 350px;

            margin: auto;

            overflow: hidden;

            border-radius: 10px;
        }


        .image-slider img {
            width: 100%;

            height: 350px;

            object-fit: contain;

            display: block;

            border-radius: 10px;

            background-color: #f5f5f5;
        }


        /* =========================
           SLIDER BUTTONS
        ========================= */

        .slider-button {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 40px;

            height: 40px;

            border-radius: 50%;

            border: none;

            background-color:
                rgba(0,0,0,0.5);

            color: white;

            font-size: 24px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 5;
        }


        .slider-button:hover {
            background-color:
                rgba(0,0,0,0.8);
        }


        .prev-button {
            left: 10px;
        }


        .next-button {
            right: 10px;
        }


        /* =========================
           IMAGE DOTS
        ========================= */

        .image-dots {
            text-align: center;

            margin-top: 12px;
        }


        .image-dot {
            display: inline-block;

            width: 10px;

            height: 10px;

            background-color: #ccc;

            border-radius: 50%;

            margin: 4px;

            cursor: pointer;
        }


        .image-dot.active {
            background-color: #ff6600;

            transform: scale(1.2);
        }


        /* =========================
           PRODUCT NAME
        ========================= */

        #productName {
            margin-top: 20px;

            margin-bottom: 10px;

            color: #333;
        }


        #productPrice {
            font-size: 20px;

            font-weight: bold;

            color: #ff6600;
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        button.action-button {
            background-color: #ff6600;

            color: white;

            border: none;

            padding: 10px 15px;

            border-radius: 5px;

            margin: 5px;

            cursor: pointer;

            font-size: 15px;
        }


        button.action-button:hover {
            background-color: #e65c00;
        }


        /* =========================
           PRODUCT DESCRIPTION
        ========================= */

        .product-description {

            margin-top: 20px;

            background-color: #ffffff;

            border: 1px solid #e0e0e0;

            border-radius: 10px;

            padding: 15px;

            text-align: left;

            box-shadow:
                0 2px 6px rgba(0,0,0,0.08);
        }


        .product-description h3 {

            margin: 0 0 15px 0;

            padding-bottom: 10px;

            border-bottom: 2px solid #ff6600;

            color: #333;

            text-align: left;

            font-size: 20px;
        }


        .description-row {

            display: flex;

            align-items: flex-start;

            padding: 9px 0;

            border-bottom: 1px solid #eeeeee;

            font-size: 15px;

            line-height: 1.5;
        }


        .description-row:last-child {
            border-bottom: none;
        }


        .description-label {

            width: 45%;

            font-weight: bold;

            color: #333;
        }


        .description-value {

            width: 55%;

            color: #555;

            word-break: break-word;
        }


        .description-loading {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-top: 10px;
        }


        /* =========================
           FIREBASE UPDATE NOTICE
        ========================= */

        .firebase-updated {

            display: none;

            margin-top: 10px;

            padding: 8px;

            border-radius: 5px;

            background: #e8f5e9;

            color: #198754;

            font-size: 13px;

            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .product-details {

                margin: 0;

                padding: 15px;

                width: 100%;

                max-width: none;

                border-radius: 0;

                box-shadow: none;
            }


            .image-slider {
                max-width: 100%;
            }


            .image-slider img {
                height: 350px;
            }


            .slider-button {

                width: 36px;

                height: 36px;

                font-size: 21px;
            }


            .product-description {

                margin-top: 20px;

                padding: 12px;
            }


            .product-description h3 {
                font-size: 18px;
            }


            .description-row {
                font-size: 14px;
            }


            .description-label {
                width: 45%;
            }


            .description-value {
                width: 55%;
            }

        }

    </style>

</head>

        <div class="description-row">

<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

    authDomain:
        "rk-store-5fb24.firebaseapp.com",

    projectId:
        "rk-store-5fb24",

    storageBucket:
        "rk-store-5fb24.firebasestorage.app",

    messagingSenderId:
        "407275549697",

    appId:
        "1:407275549697:web:41043b49bf7182cecffc00"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* =====================================================
   GET PRODUCT NUMBER
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const product =
    params.get("product");


const productNumber =
    Number(product);


/* =====================================================
   PRODUCT DATA
   PRODUCT 1-5
===================================================== */

const productData = {


    "1": {

        images: [

            "product1/product1.jpg",
            "product1/product2.jpg",
            "product1/product3.jpg",
            "product1/product4.jpg",
            "product1/product5.jpg",
            "product1/product6.jpg"

        ],

        name:

        price:
            450,

            "RK Store",

        category:
            "Men",

        color:
            "Black",

            "M, L, XL",

        material:
            "Cotton",

        details:
            "Premium quality formal shirt suitable for regular and formal use."

    },


    "2": {

        images: [

            "product2.jpg",
            "product2-2.jpg",
            "product2-3.jpg",
            "product2-4.jpg",
            "product2-5.jpg",
            "product2-6.jpg",
            "product2-7.jpg"

        ],

        name:
            "Men's Casual Shirt",

        price:
            400,

        brand:
            "RK Store",

        category:
            "Men",

        color:
            "Blue",

        size:
            "M, L, XL",

        material:
            "Cotton",

        details:
            "Comfortable casual shirt suitable for everyday use."

    },


    "3": {

        images: [

            "product3.jpg",
            "product3-2.jpg",
            "product3-3.jpg",
            "product3-4.jpg",
            "product3-5.jpg",
            "product3-6.jpg",
            "product3-7.jpg"

        ],

        name:
            "Men's Casual Check Shirt",

        price:
            480,

        brand:
            "RK Store",

        category:
            "Men",

        color:
            "Check Pattern",

        size:
            "M, L, XL",

        material:
            "Cotton",

        details:
            "Stylish checked casual shirt designed for comfortable everyday wear."

    },


    "4": {

        images: [

            "product4.jpg",
            "product4-2.jpg",
            "product4-3.jpg",
            "product4-4.jpg",
            "product4-5.jpg",
            "product4-6.jpg",
            "product4-7.jpg"

        ],

        name:
            "Women's Casual Yellow Dress",

        price:
            500,

        brand:
            "RK Store",

        category:
            "Women",

        color:
            "Yellow",

        size:
            "M, L, XL",

        material:
            "Cotton",

        details:
            "Beautiful casual yellow dress suitable for regular and casual occasions."

    },


    "5": {

        images: [

            "product5.jpg",
            "product5-2.jpg",
            "product5-3.jpg",
            "product5-4.jpg",
            "product5-5.jpg",
            "product5-6.jpg",
            "product5-7.jpg"

        ],

        name:
            "Women's Casual Dress",

        price:
            900,

        brand:
            "RK Store",

        category:
            "Women",

        color:
            "Mixed",

        size:
            "M, L, XL",

        material:
            "Cotton",

        details:
            "Comfortable women's casual dress with a stylish design for everyday use."

    }

};


/* =====================================================
   PRODUCT 6-100
===================================================== */

for (
    let i = 6;
    i <= 100;
    i++
) {

    productData[String(i)] = {

        images: [

            "product" + i + ".jpg"

        ],

        name:
            "Product " + i,

        price:
            0,

        brand:
            "RK Store",

        category:
            "",

        color:
            "",

        size:
            "",

        material:
            "",

        details:
            ""

    };

}


/* =====================================================
   CHECK PRODUCT
===================================================== */

if (
    !product ||
    productNumber < 1 ||
    productNumber > 100
) {

    showProductNotFound();

}


/* =====================================================
   CURRENT PRODUCT
===================================================== */

let currentProduct =
    productData[String(productNumber)];


/* =====================================================
   SLIDER VARIABLES
===================================================== */

let currentImageIndex =
    0;


let productImages =
    [];


/* =====================================================
   SHOW PRODUCT
===================================================== */

function showProduct(data) {

    if (!data) {

        showProductNotFound();

        return;

    }


    currentProduct =
        data;


    productImages =
        Array.isArray(data.images)
            ? data.images
            : [];


    currentImageIndex =
        0;


    /* =========================
       IMAGE
    ========================= */

    if (
        productImages.length > 0
    ) {

        const image =
            document.getElementById(
                "productImage"
            );


        image.src =
            productImages[0];


        image.alt =
            data.name ||
            "Product";

    }


    /* =========================
       NAME
    ========================= */

    document.getElementById(
        "productName"
    ).textContent =
        data.name ||
        "Product";


    /* =========================
       PRICE
    ========================= */

    document.getElementById(
        "productPrice"
    ).textContent =
        "Price: ৳" +
        Number(data.price || 0);


    /* =========================
       DESCRIPTION
    ========================= */

    showDescription(
        data
    );


    /* =========================
       DOTS
    ========================= */

    createImageDots();

}


/* =====================================================
   SHOW DESCRIPTION
===================================================== */

function showDescription(data) {

    document.getElementById(
        "productSerial"
    ).textContent =
        productNumber;


    document.getElementById(
        "descriptionProductName"
    ).textContent =
        data.name ||
        "";


    document.getElementById(
        "productBrand"
    ).textContent =
        data.brand ||
        "";


    document.getElementById(
        "productCategory"
    ).textContent =
        data.category ||
        "";


    document.getElementById(
        "productColor"
    ).textContent =
        data.color ||
        "";


    document.getElementById(
        "productSize"
    ).textContent =
        data.size ||
        "";


    document.getElementById(
        "productMaterial"
    ).textContent =
        data.material ||
        "";


    document.getElementById(
        "productDetailsText"
    ).textContent =
        data.details ||
        "";

}


/* =====================================================
   CREATE IMAGE DOTS
===================================================== */

function createImageDots() {

    const dotsContainer =
        document.getElementById(
            "imageDots"
        );


    dotsContainer.innerHTML =
        "";


    if (
        productImages.length <= 1
    ) {

        return;

    }


    productImages.forEach(
        function(image, index) {

            const dot =
                document.createElement(
                    "span"
                );


            dot.className =
                "image-dot";


            if (
                index === 0
            ) {

                dot.classList.add(
                    "active"
                );

            }


            dot.addEventListener(
                "click",
                function() {

                    showImage(
                        index
                    );

                }
            );


            dotsContainer.appendChild(
                dot
            );

        }
    );

}


/* =====================================================
   LOAD FIREBASE DESCRIPTION
===================================================== */

async function loadFirebaseDescription() {

    if (
        !product ||
        productNumber < 1 ||
        productNumber > 100
    ) {

        return;

    }


    const loading =
        document.getElementById(
            "descriptionLoading"
        );


    try {

        loading.textContent =
            "Loading latest product information...";


        const productRef =
            doc(
                db,
                "productDescriptions",
                String(productNumber)
            );


        const snapshot =
            await getDoc(
                productRef
            );


        /* =========================
           FIRESTORE DATA EXISTS
        ========================= */

        if (
            snapshot.exists()
        ) {

            const firebaseData =
                snapshot.data();


            /*
             * Firebase-এর নতুন তথ্য
             * আগের product data-এর সাথে
             * merge করা হচ্ছে।
             */

            currentProduct = {

                ...currentProduct,

                name:
                    firebaseData.name !== undefined &&
                    firebaseData.name !== ""
                        ? firebaseData.name
                        : currentProduct.name,

price:
    firebaseData.price !== undefined &&
    firebaseData.price !== ""
        ? Number(firebaseData.price)
        : currentProduct.price,

                brand:
                    firebaseData.brand !== undefined &&
                    firebaseData.brand !== ""
                        ? firebaseData.brand
                        : currentProduct.brand,

                category:
                    firebaseData.category !== undefined &&
                    firebaseData.category !== ""
                        ? firebaseData.category
                        : currentProduct.category,

                color:
                    firebaseData.color !== undefined &&
                    firebaseData.color !== ""
                        ? firebaseData.color
                        : currentProduct.color,

                size:
                    firebaseData.size !== undefined &&
                    firebaseData.size !== ""
                        ? firebaseData.size
                        : currentProduct.size,

                material:
                    firebaseData.material !== undefined &&
                    firebaseData.material !== ""
                        ? firebaseData.material
                        : currentProduct.material,

                details:
                    firebaseData.details !== undefined &&
                    firebaseData.details !== ""
                        ? firebaseData.details
                        : currentProduct.details

            };


            /* =========================
               UPDATE SCREEN
            ========================= */

            showProduct(
                currentProduct
            );


            /* =========================
               UPDATE NOTICE
            ========================= */

            const updatedNotice =
                document.getElementById(
                    "firebaseUpdated"
                );


            updatedNotice.style.display =
                "block";

        }


        loading.textContent =
            "";

    }


    catch (error) {

        console.error(
            "Firebase Description Error:",
            error
        );


        /*
         * Firebase কাজ না করলেও
         * default product information থাকবে।
         */

        loading.textContent =
            "";

    }

}


/* =====================================================
   SHOW PRODUCT NOT FOUND
===================================================== */

function showProductNotFound() {

    document.getElementById(
        "productName"
    ).textContent =
        "Product Not Found";


    document.getElementById(
        "productPrice"
    ).textContent =
        "";


    document.getElementById(
        "productSerial"
    ).textContent =
        "-";

}


/* =====================================================
   SHOW IMAGE
===================================================== */

function showImage(index) {

    if (
        productImages.length === 0
    ) {

        return;

    }


    if (
        index < 0 ||
        index >= productImages.length
    ) {

        return;

    }


    currentImageIndex =
        index;


    document.getElementById(
        "productImage"
    ).src =
        productImages[
            currentImageIndex
        ];


    const dots =
        document.querySelectorAll(
            ".image-dot"
        );


    dots.forEach(
        function(dot, i) {

            dot.classList.remove(
                "active"
            );


            if (
                i === currentImageIndex
            ) {

                dot.classList.add(
                    "active"
                );

            }

        }
    );

}


/* =====================================================
   NEXT IMAGE
===================================================== */

document.getElementById(
    "nextButton"
).addEventListener(
    "click",
    function() {

        if (
            productImages.length === 0
        ) {

            return;

        }


        currentImageIndex++;


        if (
            currentImageIndex >=
            productImages.length
        ) {

            currentImageIndex = 0;

        }


        showImage(
            currentImageIndex
        );

    }
);


/* =====================================================
   PREVIOUS IMAGE
===================================================== */

document.getElementById(
    "prevButton"
).addEventListener(
    "click",
    function() {

        if (
            productImages.length === 0
        ) {

            return;

        }


        currentImageIndex--;


        if (
            currentImageIndex < 0
        ) {

            currentImageIndex =
                productImages.length - 1;

        }


        showImage(
            currentImageIndex
        );

    }
);


/* =====================================================
   MOBILE SWIPE
===================================================== */

let touchStartX =
    0;


let touchEndX =
    0;


const imageSlider =
    document.querySelector(
        ".image-slider"
    );


imageSlider.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0].screenX;

    }
);


imageSlider.addEventListener(
    "touchend",
    function(event) {

        touchEndX =
            event.changedTouches[0].screenX;


        handleSwipe();

    }
);


/* =====================================================
   HANDLE SWIPE
===================================================== */

function handleSwipe() {

    if (
        productImages.length <= 1
    ) {

        return;

    }


    const swipeDistance =
        touchEndX -
        touchStartX;


    if (
        swipeDistance < -50
    ) {

        currentImageIndex++;


        if (
            currentImageIndex >=
            productImages.length
        ) {

            currentImageIndex = 0;

        }


        showImage(
            currentImageIndex
        );

    }


    else if (
        swipeDistance > 50
    ) {

        currentImageIndex--;


        if (
            currentImageIndex < 0
        ) {

            currentImageIndex =
                productImages.length - 1;

        }


        showImage(
            currentImageIndex
        );

    }

}


/* =====================================================
   ADD TO CART
===================================================== */

document.getElementById(
    "addToCart"
).addEventListener(
    "click",
    function() {

        if (
            !currentProduct
        ) {

            alert(
                "Product not found!"
            );

            return;

        }


        let cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];


        const cartItem = {

            name:
                currentProduct.name,

            price:
                Number(
                    currentProduct.price
                ) || 0,

            image:
                currentProduct.images &&
                currentProduct.images.length > 0

                    ? currentProduct.images[0]

                    : "",

            quantity:
                1

        };


        const existingProduct =
            cart.find(
                function(item) {

                    return (
                        item.productId ===
                        productNumber
                    )
                    ||
                    (
                        !item.productId &&
                        item.name ===
                        currentProduct.name
                    );

                }
            );


        if (
            existingProduct
        ) {

            existingProduct.quantity +=
                1;

        }

        else {

            cartItem.productId =
                productNumber;


            cart.push(
                cartItem
            );

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        alert(
            currentProduct.name +
            " added to cart!"
        );

    }
);


/* =====================================================
   BUY NOW
===================================================== */

document.getElementById(
    "buyNow"
).addEventListener(
    "click",
    function() {

        if (
            !currentProduct
        ) {

            alert(
                "Product not found!"
            );

            return;

        }


        let cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];


        const cartItem = {

            productId:
                productNumber,

            name:
                currentProduct.name,

            price:
                Number(
                    currentProduct.price
                ) || 0,

            image:
                currentProduct.images &&
                currentProduct.images.length > 0

                    ? currentProduct.images[0]

                    : "",

            quantity:
                1

        };


        const existingProduct =
            cart.find(
                function(item) {

                    return (
                        item.productId ===
                        productNumber
                    )
                    ||
                    (
                        !item.productId &&
                        item.name ===
                        currentProduct.name
                    );

                }
            );


        if (
            existingProduct
        ) {

            existingProduct.quantity +=
                1;

        }

        else {

            cart.push(
                cartItem
            );

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        window.location.href =
            "cart.html";

    }
);


/* =====================================================
   FIRST LOAD
===================================================== */

if (
    currentProduct
) {

    showProduct(
        currentProduct
    );

}


/* =====================================================
   LOAD LATEST FIREBASE DATA
===================================================== */

loadFirebaseDescription();


</script>
