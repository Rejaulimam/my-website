<!DOCTYPE html><html>
<head>
    <title>Product Details</title><style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    h1 {
        background-color: #ff6600;
        color: white;
        text-align: center;
        padding: 20px;
        margin: 0;
    }

    .product-details {
        background-color: white;
        margin: 20px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product-details img {
        width: 250px;
        max-width: 100%;
        border-radius: 10px;
    }

    button {
        background-color: #ff6600;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        margin: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #e65c00;
    }
</style>

</head><body><h1>Product Details</h1><div class="product-details"><img id="productImage"
     src="product1.jpg"
     alt="Product">

<h2 id="productName">
    Men's Casual Brown Check Shirt
</h2>

<p id="productPrice">
    Price: ৳500
</p>

<p>
    This is a product from RK Store.
</p>

<button id="addToCart">
    Add to Cart
</button>

<button id="buyNow">
    Buy Now
</button>

</div><script>

    /* =========================
       GET PRODUCT NUMBER
    ========================= */

    const params =
        new URLSearchParams(window.location.search);

    const product =
        params.get("product");


    /* =========================
       PRODUCT DATA
    ========================= */

    const productData = {

        "1": {
            image: "product1.jpg",
            name: "Men's Casual Brown Check Shirt",
            price: 500
        },

        "2": {
            image: "product2.jpg",
            name: "Men's Casual Print Shirt",
            price: 800
        },

        "3": {
            image: "product3.jpg",
            name: "Men's Casual White Shirt",
            price: 1000
        },

        "4": {
            image: "product4.jpg",
            name: "Men's Casual Navy Check Shirt",
            price: 1200
        }

    };


    /* =========================
       SELECT PRODUCT
    ========================= */

    const selectedProduct =
        productData[product];


    /* =========================
       SHOW PRODUCT
    ========================= */

    if (selectedProduct) {

        document.getElementById("productImage").src =
            selectedProduct.image;

        document.getElementById("productImage").alt =
            selectedProduct.name;

        document.getElementById("productName").textContent =
            selectedProduct.name;

        document.getElementById("productPrice").textContent =
            "Price: ৳" + selectedProduct.price;

    }


    /* =========================
       ADD TO CART
    ========================= */

    document.getElementById("addToCart")
        .addEventListener("click", function() {

            if (!selectedProduct) {
                alert("Product not found!");
                return;
            }

            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];


            const cartItem = {

                name: selectedProduct.name,

                price: selectedProduct.price,

                image: selectedProduct.image,

                quantity: 1

            };


            const existingProduct =
                cart.find(
                    item =>
                    item.name === selectedProduct.name
                );


            if (existingProduct) {

                existingProduct.quantity += 1;

            } else {

                cart.push(cartItem);

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            alert(
                selectedProduct.name +
                " added to cart!"
            );

        });


    /* =========================
       BUY NOW
    ========================= */

    document.getElementById("buyNow")
        .addEventListener("click", function() {

            if (!selectedProduct) {
                alert("Product not found!");
                return;
            }

            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];


            const cartItem = {

                name: selectedProduct.name,

                price: selectedProduct.price,

                image: selectedProduct.image,

                quantity: 1

            };


            const existingProduct =
                cart.find(
                    item =>
                    item.name === selectedProduct.name
                );


            if (existingProduct) {

                existingProduct.quantity += 1;

            } else {

                cart.push(cartItem);

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            window.location.href =
                "cart.html";

        });

</script></body>
</html>
