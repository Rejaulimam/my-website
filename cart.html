<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .cart-container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
        }

        .cart-item {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 0 5px #ccc;
        }

        .cart-item h2 {
            margin: 0 0 10px;
        }

        .price {
            color: #ff6600;
            font-weight: bold;
        }

        .remove-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .total {
            background-color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
        }

        .empty {
            text-align: center;
            font-size: 20px;
            margin-top: 50px;
        }
.quantity-control {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
}

.quantity-control button {
    width: 35px;
    height: 35px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid #ccc;
    background-color: #f5f5f5;
    border-radius: 5px;
}

.quantity-control span {
    font-size: 18px;
    font-weight: bold;
    min-width: 25px;
    text-align: center;
}
    </style>
</head>

<body>

    <h1>RK Store - Cart</h1>

    <div class="cart-container" id="cart-container">
    </div>

    <script>

        function showCart() {

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            const container =
                document.getElementById("cart-container");

            container.innerHTML = "";

            if (cart.length === 0) {

                container.innerHTML =
                    '<p class="empty">Your cart is empty.</p>';

                return;
            }

            let total = 0;

            cart.forEach((product, index) => {

total += product.price * product.quantity;

                const item = document.createElement("div");

                item.className = "cart-item";

item.innerHTML = `
    <h2>${product.name}</h2>

    <p class="price">
        Price: ৳${product.price} × ${product.quantity}
    </p>

    <div class="quantity-control">
        <button onclick="decreaseQuantity(${index})">−</button>
        <span>${product.quantity}</span>
        <button onclick="increaseQuantity(${index})">+</button>
    </div>

    <button
        class="remove-btn"
        onclick="removeFromCart(${index})">
        Remove
    </button>
`;













                container.appendChild(item);

            });


            const totalDiv =
                document.createElement("div");

            totalDiv.className = "total";

            totalDiv.textContent =
                "Total: ৳" + total;

            container.appendChild(totalDiv);

        }

function increaseQuantity(index) {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    cart[index].quantity++;

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    showCart();
}


function decreaseQuantity(index) {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    if (cart[index].quantity > 1) {
        cart[index].quantity--;
    }

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    showCart();
}
        function removeFromCart(index) {

            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            cart.splice(index, 1);

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            showCart();

        }


        showCart();

    </script>

</body>
</html>
