<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RK Store - Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: #ff6600;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 6px 0 0;
        }

        .container {
            width: 94%;
            max-width: 900px;
            margin: 25px auto;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .top-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .refresh {
            background: #1976d2;
        }

        .logout {
            background: #d32f2f;
        }

        .filter-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .filter-box label {
            font-weight: bold;
        }

        .filter-box select {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .order-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-card h2 {
            margin-top: 0;
            color: #ff6600;
        }

        .customer-box {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
        }

        .product {
            border-top: 1px solid #ddd;
            padding: 10px 0;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: #ff6600;
        }

        .status-box {
            margin-top: 15px;
        }

        .status-box select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
            margin-top: 5px;
        }

        .no-orders {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .error {
            background: #ffe0e0;
            color: #b00020;
            padding: 15px;
            border-radius: 6px;
        }

        @media (max-width: 600px) {

            .top-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="header">

    <h1>RK Store</h1>

    <p>Admin Dashboard</p>

</div>


<div class="container">


    <div class="top-buttons">

        <button
            class="refresh"
            onclick="loadOrders()"
        >
            🔄 Refresh Orders
        </button>

        <button
            class="logout"
            onclick="logoutAdmin()"
        >
            🚪 Admin Logout
        </button>

    </div>


    <div class="filter-box">

        <label>
            Filter Orders
        </label>

        <select
            id="statusFilter"
            onchange="loadOrders()"
        >

            <option value="All">
                All Orders
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Confirmed">
                Confirmed
            </option>

            <option value="Shipped">
                Shipped
            </option>

            <option value="Delivered">
                Delivered
            </option>

        </select>

    </div>


    <div id="loading">

        Loading all orders...

    </div>


    <div id="ordersContainer"></div>


</div>



<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {

    initializeApp

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

    getFirestore,

    collection,

    getDocs,

    doc,

    updateDoc

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {

    getAuth,

    onAuthStateChanged,

    signOut

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

    authDomain:
        "rk-store-5fb24.firebaseapp.com",

    projectId:
        "rk-store-5fb24",

    storageBucket:
        "rk-store-5fb24.firebasestorage.app",

    messagingSenderId:
        "407275549697",

    appId:
        "1:407275549697:web:41043b49bf7182cecffc00"

};


/* ==================================================
   INITIALIZE
================================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const auth =
    getAuth(app);


/* ==================================================
   ADMIN LOGIN CHECK
================================================== */

onAuthStateChanged(

    auth,

    function(user) {

        if (!user) {

            window.location.href =
                "admin-login.html";

            return;

        }


        console.log(
            "Admin Dashboard User:",
            user.email
        );


        loadOrders();

    }

);


/* ==================================================
   LOAD ALL ORDERS
================================================== */

window.loadOrders =

async function() {

    const loading =
        document.getElementById(
            "loading"
        );

    const container =
        document.getElementById(
            "ordersContainer"
        );

    const filter =
        document.getElementById(
            "statusFilter"
        ).value;


    loading.style.display =
        "block";

    loading.innerText =
        "Loading all orders...";


    container.innerHTML = "";


    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "orders"
                )
            );


        let ordersHTML = "";

        let count = 0;


        snapshot.forEach(

            function(orderDoc) {

                const order =
                    orderDoc.data();


                const status =
                    order.status ||
                    "Pending";


                /* =========================
                   STATUS FILTER
                ========================= */

                if (
                    filter !== "All" &&
                    status !== filter
                ) {

                    return;

                }


                count++;


                /* =========================
                   PRODUCTS
                ========================= */

                let productsHTML = "";


                if (
                    Array.isArray(
                        order.products
                    )
                ) {

                    order.products.forEach(

                        function(product) {

                            const price =
                                Number(
                                    product.price
                                ) || 0;


                            const quantity =
                                Number(
                                    product.quantity
                                ) || 1;


                            const subtotal =
                                price *
                                quantity;


                            productsHTML += `

                                <div class="product">

                                    <strong>
                                        ${
                                            product.name ||
                                            "Product"
                                        }
                                    </strong>

                                    <p>
                                        Price:
                                        ৳${price}
                                    </p>

                                    <p>
                                        Quantity:
                                        ${quantity}
                                    </p>

                                    <p>
                                        Subtotal:
                                        ৳${subtotal}
                                    </p>

                                </div>

                            `;

                        }

                    );

                }


                /* =========================
                   ORDER CARD
                ========================= */

                ordersHTML += `

                    <div class="order-card">

                        <h2>
                            Order #
                            ${
                                order.orderId ||
                                orderDoc.id
                            }
                        </h2>


                        <div class="customer-box">

                            <h3>
                                👤 Customer Information
                            </h3>

                            <p>
                                <strong>Name:</strong>
                                ${
                                    order.customerName ||
                                    "N/A"
                                }
                            </p>

                            <p>
                                <strong>Email:</strong>
                                ${
                                    order.customerEmail ||
                                    "N/A"
                                }
                            </p>

                            <p>
                                <strong>Mobile:</strong>
                                ${
                                    order.customerMobile ||
                                    "N/A"
                                }
                            </p>

                            <p>
                                <strong>Address:</strong>
                                ${
                                    order.customerAddress ||
                                    "N/A"
                                }
                            </p>

                            <p>
                                <strong>Customer ID:</strong>
                                ${
                                    order.customerId ||
                                    "N/A"
                                }
                            </p>

                        </div>


                        <p>
                            <strong>Date:</strong>
                            ${
                                order.dateTime ||
                                "N/A"
                            }
                        </p>


                        <p>
                            <strong>Payment Method:</strong>
                            ${
                                order.paymentMethod ||
                                "N/A"
                            }
                        </p>


                        ${
                            order.paymentNumber
                            ?
                            `
                            <p>
                                <strong>Payment Number:</strong>
                                ${order.paymentNumber}
                            </p>
                            `
                            :
                            ""
                        }


                        ${
                            order.transactionId
                            ?
                            `
                            <p>
                                <strong>Transaction ID:</strong>
                                ${order.transactionId}
                            </p>
                            `
                            :
                            ""
                        }


                        <h3>
                            📦 Products
                        </h3>


                        ${productsHTML}


                        <div class="total">

                            Total:
                            ৳${
