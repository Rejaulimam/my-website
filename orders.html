<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RK Store - Orders</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 15px;
            margin: 0;
        }

        .orders-container {
            padding: 20px;
        }
.search-filter {
    padding: 15px 20px;
    background-color: white;
}

.search-filter input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}
#filterStatus {
    margin: 0 20px 15px 20px;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: white;
}

        .order {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .order h2 {
            color: #ff6600;
        }

        .order p {
            font-size: 16px;
        }

        .status {
            color: #ff6600;
            font-weight: bold;
        }

       .status-select {
    padding: 8px 12px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 5px;
    margin-left: 5px;
    cursor: pointer;
}

/* Pending */
.status-select.pending {
    background-color: #f39c12 !important;
    color: white !important;
}
/* Confirmed */
.status-select.confirmed {
    background-color: #3498db !important;
    color: white !important;
}
/* Shipped */
.status-select.shipped {
    background-color: #9b59b6 !important;
    color: white !important;
}

/* Delivered */
.status-select.delivered {
    background-color: #27ae60 !important;
    color: white !important;
}

        .delete-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background-color: #c62828;
        }
    </style>
</head>

<body>

    <h1>RK Store - Orders</h1>
<div class="search-filter">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by name or phone..."
    >
</div>
<select id="filterStatus">
    <option value="All">All Orders</option>
    <option value="Pending">Pending</option>
    <option value="Confirmed">Confirmed</option>
    <option value="Shipped">Shipped</option>
    <option value="Delivered">Delivered</option>
</select>


    <div class="orders-container" id="ordersContainer"></div>

<script>

const ordersContainer = document.getElementById("ordersContainer");

const orders = JSON.parse(localStorage.getItem("orders")) || [];


if (orders.length === 0) {

    ordersContainer.innerHTML = "<p>No orders found.</p>";

} else {

    let allOrdersHTML = "";

    orders.forEach((order, orderIndex) => {

        let productsHTML = "";
        let orderTotal = 0;

        // যদি পুরোনো Order-এ status না থাকে
        let orderStatus = order.status || "Pending";


        order.products.forEach((product, index) => {

            let quantity = product.quantity || 1;
            let price = product.price || 0;
            let total = price * quantity;

            orderTotal += total;

            productsHTML += `
                <p>
                    <strong>Product ${index + 1}:</strong>
                    ${product.name || "Product"}
                    <br>

                    <strong>Quantity:</strong>
                    ${quantity}
                    <br>

                    <strong>Price:</strong>
                    ৳${price}
                    <br>

                    <strong>Total:</strong>
                    ৳${total}
                </p>

                <hr>
            `;
        });


        allOrdersHTML += `

            <div class="order">

                <h2>Order #${orderIndex + 1}</h2>

<p>
    <strong>Order ID:</strong>
    ${order.orderId || "Not available"}
</p>

                <p>
                    <strong>Name:</strong>
                    ${order.customerName}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${order.customerMobile}
                </p>

                <p>
                    <strong>Address:</strong>
                    ${order.customerAddress}
                </p>

<p>
    <strong>Date & Time:</strong>
    ${order.dateTime || "Not available"}
</p>

                <h3>Order Products</h3>

                ${productsHTML}


                <p>
                    <strong>Order Total:</strong>
                    ৳${orderTotal}
                </p>


                <p>
                    <strong class="status">Status:</strong>

<select
                 class="status-select ${orderStatus.toLowerCase()}"
                        onchange="changeStatus(${orderIndex}, this.value)"
                    >

                        <option value="Pending"
                            ${orderStatus === "Pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="Confirmed"
                            ${orderStatus === "Confirmed" ? "selected" : ""}>
                            Confirmed
                        </option>

                        <option value="Shipped"
                            ${orderStatus === "Shipped" ? "selected" : ""}>
                            Shipped
                        </option>

                        <option value="Delivered"
                            ${orderStatus === "Delivered" ? "selected" : ""}>
                            Delivered
                        </option>

                    </select>

                </p>


                <button
                    class="delete-btn"
                    onclick="deleteOrder(${orderIndex})"
                >
                    Delete Order
                </button>

            </div>

        `;
    });


    ordersContainer.innerHTML = allOrdersHTML;
}


/* =========================
   CHANGE ORDER STATUS
========================= */

function changeStatus(orderIndex, newStatus) {

    orders[orderIndex].status = newStatus;

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );

    location.reload();
}


/* =========================
   DELETE ORDER
========================= */

function deleteOrder(orderIndex) {

    orders.splice(orderIndex, 1);

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );

    location.reload();
}
function filterOrders() {

    const searchText =
        document.getElementById("searchInput").value.toLowerCase();

    const selectedStatus =
        document.getElementById("filterStatus").value;

    const orderElements =
        document.querySelectorAll(".order");

    orderElements.forEach((orderElement, index) => {

        const orderText =
            orderElement.innerText.toLowerCase();

        const orderStatus =
            orders[index].status || "Pending";

        const matchesSearch =
            orderText.includes(searchText);

        const matchesStatus =
            selectedStatus === "All" ||
            orderStatus === selectedStatus;

        if (matchesSearch && matchesStatus) {
            orderElement.style.display = "block";
        } else {
            orderElement.style.display = "none";
        }

    });
}

document.getElementById("searchInput")
    .addEventListener("input", filterOrders);

document.getElementById("filterStatus")
    .addEventListener("change", filterOrders);


</script>

</body>
</html>
