<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RK Store - Orders</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }


        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 15px;
            margin: 0;
        }


        /* =========================
           SEARCH
        ========================= */

        .search-filter {
            padding: 15px 20px;
            background-color: white;
        }


        .search-filter input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }


        /* =========================
           STATUS FILTER
        ========================= */

        #filterStatus {
            width: calc(100% - 40px);
            margin: 0 20px 15px 20px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
        }


        /* =========================
           ORDERS CONTAINER
        ========================= */

        .orders-container {
            padding: 20px;
        }


        /* =========================
           ORDER CARD
        ========================= */

        .order {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.1);
        }


        .order h2 {
            color: #ff6600;
            margin-top: 0;
        }


        .order p {
            font-size: 16px;
            line-height: 1.5;
        }


        /* =========================
           PRODUCT
        ========================= */

        .product {
            border-top: 1px solid #ddd;
            padding-top: 10px;
            margin-top: 10px;
        }


        /* =========================
           STATUS SELECT
        ========================= */

        .status-select {
            padding: 8px 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            margin-left: 5px;
            cursor: pointer;
        }


        .status-select.pending {
            background-color: #f39c12 !important;
            color: white !important;
        }


        .status-select.confirmed {
            background-color: #3498db !important;
            color: white !important;
        }


        .status-select.shipped {
            background-color: #9b59b6 !important;
            color: white !important;
        }


        .status-select.delivered {
            background-color: #27ae60 !important;
            color: white !important;
        }


        .status-select.cancelled {
            background-color: #e53935 !important;
            color: white !important;
        }

.delivery-select {
    padding: 8px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: white;
    cursor: pointer;
    margin-left: 5px;
}

        /* =========================
           BUTTONS
        ========================= */

        .view-details-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            margin-right: 5px;
        }


        .view-details-btn:hover {
            background-color: #2980b9;
        }


        .delete-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }


        .delete-btn:hover {
            background-color: #c62828;
        }


        /* =========================
           NO ORDERS
        ========================= */

        .no-orders {
            text-align: center;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .orders-container {
                padding: 10px;
            }


            .order {
                padding: 15px;
            }


            .order h2 {
                font-size: 20px;
            }


            .order p {
                font-size: 15px;
            }


            .view-details-btn,
            .delete-btn {
                width: 100%;
                margin-right: 0;
            }


            .status-select {
                margin-left: 0;
                margin-top: 5px;
            }

        }

    </style>

</head>


<body>


<h1>
    RK Store - Orders
</h1>


<!-- =========================
     SEARCH
========================= -->

<div class="search-filter">

    <input
        type="text"
        id="searchInput"
        placeholder="Search by name, phone or Order ID..."
    >

</div>


<!-- =========================
     STATUS FILTER
========================= -->

<select
    id="filterStatus"
>

    <option value="All">
        All Orders
    </option>

    <option value="Pending">
        Pending
    </option>

    <option value="Confirmed">
        Confirmed
    </option>

    <option value="Shipped">
        Shipped
    </option>

    <option value="Delivered">
        Delivered
    </option>

    <option value="Cancelled">
        Cancelled
    </option>

</select>


<!-- =========================
     ORDERS
========================= -->

<div
    class="orders-container"
    id="ordersContainer"
>

    <div class="loading">
        Loading Orders...
    </div>

</div>


<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

    authDomain:
        "rk-store-5fb24.firebaseapp.com",

    projectId:
        "rk-store-5fb24",

    storageBucket:
        "rk-store-5fb24.firebasestorage.app",

    messagingSenderId:
        "407275549697",

    appId:
        "1:407275549697:web:41043b49bf7182cecffc00"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const auth =
    getAuth(app);


/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
    "REJAUL.IMAM@gmail.com";


/* =====================================================
   GLOBAL ORDERS
===================================================== */

let orders = [];


/* =====================================================
   AUTH CHECK
===================================================== */

onAuthStateChanged(
    auth,
    async function(user) {


        /* =========================
           NOT LOGGED IN
        ========================= */

        if (!user) {

            window.location.href =
                "admin-login.html";

            return;

        }


        /* =========================
           ADMIN EMAIL CHECK
        ========================= */

        if (
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            alert(
                "Access denied. Admin login required."
            );


            window.location.href =
                "admin-login.html";

            return;

        }


        /* =========================
           ADMIN VERIFIED
        ========================= */

        console.log(
            "Admin verified:",
            user.email
        );


        await loadOrders();

    }
);


/* =====================================================
   LOAD ORDERS FROM FIREBASE
===================================================== */

async function loadOrders() {

    const ordersContainer =
        document.getElementById(
            "ordersContainer"
        );


    ordersContainer.innerHTML = `

        <div class="loading">
            Loading Orders...
        </div>

    `;


    try {

        const querySnapshot =
            await getDocs(
                collection(
                    db,
                    "orders"
                )
            );


        orders = [];


        querySnapshot.forEach(
            function(docSnapshot) {

                const data =
                    docSnapshot.data();


                orders.push({

                    ...data,

                    firebaseId:
                        docSnapshot.id

                });

            }
        );


        /* =========================
           NEWEST ORDER FIRST
        ========================= */

        orders.sort(
            function(a, b) {

                const dateA =
                    getOrderDate(a);


                const dateB =
                    getOrderDate(b);


                return dateB - dateA;

            }
        );


        /* =========================
           LOCAL STORAGE BACKUP
        ========================= */

        saveOrdersToLocalStorage();


        displayOrders();

    }


    catch (error) {

        console.error(
            "Firebase Orders Error:",
            error
        );


        ordersContainer.innerHTML = `

            <div class="no-orders">

                <h2>
                    Orders Could Not Be Loaded
                </h2>

                <p>
                    Please check your internet connection
                    and Firebase settings.
                </p>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}


/* =====================================================
   GET ORDER DATE
===================================================== */

function getOrderDate(order) {

    try {

        if (
            order.createdAt &&
            typeof order.createdAt.toDate ===
            "function"
        ) {

            return order.createdAt.toDate();

        }


        if (
            order.createdAt &&
            typeof order.createdAt ===
            "string"
        ) {

            return new Date(
                order.createdAt
            );

        }


        if (
            order.dateTime
        ) {

            return new Date(
                order.dateTime
            );

        }

    }

    catch (error) {

        console.log(
            "Date Error:",
            error
        );

    }


    return new Date(0);

}


/* =====================================================
   SAVE LOCAL STORAGE
===================================================== */

function saveOrdersToLocalStorage() {

    const safeOrders =
        orders.map(
            function(order) {

                const copy = {
                    ...order
                };


                if (
                    copy.createdAt &&
                    typeof copy.createdAt.toDate ===
                    "function"
                ) {

                    copy.createdAt =
                        copy.createdAt
                            .toDate()
                            .toISOString();

                }


                return copy;

            }
        );


    localStorage.setItem(
        "orders",
        JSON.stringify(
            safeOrders
        )
    );

}


/* =====================================================
   DISPLAY ORDERS
===================================================== */

function displayOrders() {

    const ordersContainer =
        document.getElementById(
            "ordersContainer"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const filterStatus =
        document.getElementById(
            "filterStatus"
        );


    const searchText =
        searchInput.value
            .toLowerCase()
            .trim();


    const selectedStatus =
        filterStatus.value;


    ordersContainer.innerHTML =
        "";


    if (
        orders.length === 0
    ) {

        ordersContainer.innerHTML = `

            <div class="no-orders">

                <h2>
                    No Orders Found
                </h2>

                <p>
                    There are no orders yet.
                </p>

            </div>

        `;

        return;

    }


    let foundOrders =
        0;


    orders.forEach(
        function(order, index) {


            /* =========================
               ORDER ID
            ========================= */

            const orderId =
                String(
                    order.orderId ||
                    ("RK-" + (index + 1))
                );


            /* =========================
               CUSTOMER DATA
            ========================= */

            const customerName =
                String(
                    order.customerName ||
                    ""
                );


            const customerMobile =
                String(
                    order.customerMobile ||
                    ""
                );


            const customerAddress =
                String(
                    order.customerAddress ||
                    ""
                );


            /* =========================
               STATUS
            ========================= */

            const status =
                order.status ||
                "Pending";


            const statusUpdatedTime =
                order.statusUpdatedTime ||
                "Not updated";

/* =========================
   DELIVERY TIME
========================= */

const deliveryTime =
    order.deliveryTime ||
    "";

            /* =========================
               SEARCH
            ========================= */

            const searchMatch =

                customerName
                    .toLowerCase()
                    .includes(
                        searchText
                    )

                ||

                customerMobile
                    .toLowerCase()
                    .includes(
                        searchText
                    )

                ||

                orderId
                    .toLowerCase()
                    .includes(
                        searchText
                    );


            /* =========================
               STATUS FILTER
            ========================= */

            const statusMatch =

                selectedStatus ===
                "All"

                ||

                status ===
                selectedStatus;


            if (
                !searchMatch ||
                !statusMatch
            ) {

                return;

            }


            foundOrders++;


            /* =========================
               PRODUCTS
            ========================= */

            let productsHTML =
                "";


            let totalAmount =
                0;


            if (
                Array.isArray(
                    order.products
                ) &&
                order.products.length > 0
            ) {


                order.products.forEach(
                    function(product) {


                        const quantity =
                            Number(
                                product.quantity
                            ) || 1;


                        const price =
                            Number(
                                product.price
                            ) || 0;


                        const subtotal =
                            price *
                            quantity;


                        totalAmount +=
                            subtotal;


                        productsHTML += `

    <div class="product">

        <p>

            <strong>
                Product Serial:
            </strong>

            <span style="
                color:#ff6600;
                font-weight:bold;
                font-size:17px;
            ">

                ${
                    escapeHTML(
                        product.productSerial ||
                        product.productId ||
                        "N/A"
                    )
                }

            </span>

        </p>


        <p>

            <strong>
                Product:
            </strong>

            ${
                escapeHTML(
                    product.name ||
                    "Product"
                )
            }

        </p>


        <p>

            <strong>
                Price:
            </strong>

            ৳${price}

        </p>


        <p>

            <strong>
                Quantity:
            </strong>

            ${quantity}

        </p>


        <p>

            <strong>
                Subtotal:
            </strong>

            ৳${subtotal}

        </p>

    </div>

`;
                    }
                );

            }


            /* =========================
               ORDER CARD
            ========================= */

            const orderHTML = `

                <div class="order">

                    <h2>
                        Order ID:
                        ${escapeHTML(orderId)}
                    </h2>


                    <p>

                        <strong>
                            Name:
                        </strong>

                        ${escapeHTML(customerName)}

                    </p>


                    <p>

                        <strong>
                            Phone:
                        </strong>

                        ${escapeHTML(customerMobile)}

                    </p>


                    <p>

                        <strong>
                            Address:
                        </strong>

                        ${escapeHTML(customerAddress)}

                    </p>


                    <h3>
                        Order Products
                    </h3>


                    ${
                        productsHTML ||
                        "<p>No product information.</p>"
                    }


                    <p>

                        <strong>
                            Order Total:
                        </strong>

                        ৳${totalAmount}

                    </p>


                    <p>

                        <strong>
                            Status:
                        </strong>


                        <select

                            class="status-select ${status.toLowerCase()}"

                            data-index="${index}"

                        >

                            <option
                                value="Pending"
                                ${
                                    status ===
                                    "Pending"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Pending
                            </option>


                            <option
                                value="Confirmed"
                                ${
                                    status ===
                                    "Confirmed"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Confirmed
                            </option>


                            <option
                                value="Shipped"
                                ${
                                    status ===
                                    "Shipped"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Shipped
                            </option>


                            <option
                                value="Delivered"
                                ${
                                    status ===
                                    "Delivered"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Delivered
                            </option>


                            <option
                                value="Cancelled"
                                ${
                                    status ===
                                    "Cancelled"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Cancelled
                            </option>

                        </select>

                    </p>

${
    status === "Confirmed"
        ? `

            <p>

                <strong>
                    Expected Delivery:
                </strong>

                <select
                    class="delivery-select"
                    data-index="${index}"
                >

                    <option value="">
                        Select Delivery Time
                    </option>

                    <option
                        value="1–2 Days"
                        ${
                            deliveryTime === "1–2 Days"
                                ? "selected"
                                : ""
                        }
                    >
                        1–2 Days
                    </option>

                    <option
                        value="3–5 Days"
                        ${
                            deliveryTime === "3–5 Days"
                                ? "selected"
                                : ""
                        }
                    >
                        3–5 Days
                    </option>

                    <option
                        value="5–7 Days"
                        ${
                            deliveryTime === "5–7 Days"
                                ? "selected"
                                : ""
                        }
                    >
                        5–7 Days
                    </option>

                    <option
                        value="7 Days"
                        ${
                            deliveryTime === "7 Days"
                                ? "selected"
                                : ""
                        }
                    >
                        7 Days
                    </option>

                    <option
                        value="7–10 Days"
                        ${
                            deliveryTime === "7–10 Days"
                                ? "selected"
                                : ""
                        }
                    >
                        7–10 Days
                    </option>

                </select>

            </p>

        `
        : ""
}


                    <p>

                        <strong>
                            Status Updated:
                        </strong>

                        ${
                            escapeHTML(
                                statusUpdatedTime
                            )
                        }

                    </p>


                    <button
                        class="view-details-btn"
                        data-index="${index}"
                    >
                        View Details
                    </button>


                    <button
                        class="delete-btn"
                        data-index="${index}"
                    >
                        Delete Order
                    </button>

                </div>

            `;


            ordersContainer.innerHTML +=
                orderHTML;

        }
    );


    /* =========================
       NO MATCH
    ========================= */

    if (
        foundOrders === 0
    ) {

        ordersContainer.innerHTML = `

            <div class="no-orders">

                <h2>
                    No Matching Orders
                </h2>

                <p>
                    No order matches your search
                    or filter.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        displayOrders
    );


/* =====================================================
   FILTER
===================================================== */

document
    .getElementById(
        "filterStatus"
    )
    .addEventListener(
        "change",
        displayOrders
    );


/* =====================================================
   BUTTON EVENTS
===================================================== */

document
    .getElementById(
        "ordersContainer"
    )
    .addEventListener(
        "click",
        function(event) {


            /* =========================
               VIEW DETAILS
            ========================= */

            if (
                event.target.classList.contains(
                    "view-details-btn"
                )
            ) {

                const index =
                    Number(
                        event.target.dataset.index
                    );


                viewDetails(index);

            }


            /* =========================
               DELETE
            ========================= */

            if (
                event.target.classList.contains(
                    "delete-btn"
                )
            ) {

                const index =
                    Number(
                        event.target.dataset.index
                    );


                deleteOrder(index);

            }

        }
    );


/* =====================================================
   STATUS CHANGE EVENT
===================================================== */

document
    .getElementById(
        "ordersContainer"
    )
    .addEventListener(
        "change",
        function(event) {


            if (
                event.target.classList.contains(
                    "status-select"
                )
            ) {

                const index =
                    Number(
                        event.target.dataset.index
                    );


                const newStatus =
                    event.target.value;


                changeStatus(
                    index,
                    newStatus
                );

            }

        }
    );

/* =====================================================
   DELIVERY TIME CHANGE EVENT
===================================================== */

document
    .getElementById(
        "ordersContainer"
    )
    .addEventListener(
        "change",
        function(event) {

            if (
                event.target.classList.contains(
                    "delivery-select"
                )
            ) {

                const index =
                    Number(
                        event.target.dataset.index
                    );

                const deliveryTime =
                    event.target.value;

                changeDeliveryTime(
                    index,
                    deliveryTime
                );

            }

        }
    );


/* =====================================================
   CHANGE DELIVERY TIME
===================================================== */

async function changeDeliveryTime(
    index,
    deliveryTime
) {

    const order =
        orders[index];


    if (!order) {

        return;

    }


    try {

        /* =========================
           FIREBASE UPDATE
        ========================= */

        if (
            order.firebaseId
        ) {

            await updateDoc(

                doc(
                    db,
                    "orders",
                    order.firebaseId
                ),

                {

                    deliveryTime:
                        deliveryTime

                }

            );

        }


        /* =========================
           LOCAL UPDATE
        ========================= */

        orders[index].deliveryTime =
            deliveryTime;


        /* =========================
           LOCAL STORAGE
        ========================= */

        saveOrdersToLocalStorage();


        displayOrders();

    }


    catch (error) {

        console.error(
            "Delivery Time Update Error:",
            error
        );


        alert(
            "Delivery time update failed. Please try again."
        );

    }

}


/* =====================================================
   CHANGE STATUS
===================================================== */

async function changeStatus(
    index,
    newStatus
) {

    const order =
        orders[index];


    if (!order) {

        return;

    }


    try {

        const now =
            new Date();


        const statusUpdatedTime =
            now.toLocaleString();


        /* =========================
           FIREBASE UPDATE
        ========================= */

        if (
            order.firebaseId
        ) {

            await updateDoc(

                doc(
                    db,
                    "orders",
                    order.firebaseId
                ),

                {

                    status:
                        newStatus,

                    statusUpdatedTime:
                        statusUpdatedTime

                }

            );

        }


        /* =========================
           LOCAL UPDATE
        ========================= */

        orders[index].status =
            newStatus;


        orders[index].statusUpdatedTime =
            statusUpdatedTime;


        /* =========================
           LOCAL STORAGE
        ========================= */

        saveOrdersToLocalStorage();


        displayOrders();

    }


    catch (error) {

        console.error(
            "Status Update Error:",
            error
        );


        alert(
            "Status update failed. Please try again."
        );

    }

}


/* =====================================================
   DELETE ORDER
===================================================== */

async function deleteOrder(
    index
) {

    const order =
        orders[index];


    if (!order) {

        return;

    }


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this order?"
        );


    if (!confirmDelete) {

        return;

    }


    try {


        /* =========================
           FIREBASE DELETE
        ========================= */

        if (
            order.firebaseId
        ) {

            await deleteDoc(

                doc(
                    db,
                    "orders",
                    order.firebaseId
                )

            );

        }


        /* =========================
           REMOVE LOCAL ARRAY
        ========================= */

        orders.splice(
            index,
            1
        );


        /* =========================
           LOCAL STORAGE
        ========================= */

        saveOrdersToLocalStorage();


        displayOrders();

    }


    catch (error) {

        console.error(
            "Delete Order Error:",
            error
        );


        alert(
            "Order could not be deleted. Please try again."
        );

    }

}


/* =====================================================
   VIEW DETAILS
===================================================== */

function viewDetails(
    index
) {

    const order =
        orders[index];


    if (!order) {

        alert(
            "Order not found."
        );

        return;

    }


    /* =========================
       FIREBASE DOCUMENT ID
    ========================= */

    if (!order.firebaseId) {

        alert(
            "Order Firebase ID not found."
        );

        return;

    }


    /* =========================
       OPEN DETAILS PAGE
       USING FIRESTORE DOCUMENT ID
    ========================= */

    window.location.href =
        "order-details.html?id=" +
        encodeURIComponent(
            order.firebaseId
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
