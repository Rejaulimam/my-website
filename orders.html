<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RK Store - Orders</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 15px;
            margin: 0;
        }

        .orders-container {
            padding: 20px;
        }
.search-filter {
    padding: 15px 20px;
    background-color: white;
}

.search-filter input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}
#filterStatus {
    margin: 0 20px 15px 20px;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: white;
}

        .order {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .order h2 {
            color: #ff6600;
        }

        .order p {
            font-size: 16px;
        }

        .status {
            color: #ff6600;
            font-weight: bold;
        }

       .status-select {
    padding: 8px 12px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 5px;
    margin-left: 5px;
    cursor: pointer;
}

/* Pending */
.status-select.pending {
    background-color: #f39c12 !important;
    color: white !important;
}
/* Confirmed */
.status-select.confirmed {
    background-color: #3498db !important;
    color: white !important;
}
/* Shipped */
.status-select.shipped {
    background-color: #9b59b6 !important;
    color: white !important;
}

/* Delivered */
.status-select.delivered {
    background-color: #27ae60 !important;
    color: white !important;
}

        .delete-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background-color: #c62828;
        }
.view-details-btn {
    background-color: #3498db;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
    margin-right: 5px;
}

.view-details-btn:hover {
    background-color: #2980b9;
}

    </style>
</head>

<body>

    <h1>RK Store - Orders</h1>
<div class="search-filter">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by name, phone or Order ID..."
    >
</div>
<select id="filterStatus">
    <option value="All">All Orders</option>
    <option value="Pending">Pending</option>
    <option value="Confirmed">Confirmed</option>
    <option value="Shipped">Shipped</option>
    <option value="Delivered">Delivered</option>
</select>


    <div class="orders-container" id="ordersContainer"></div>

<script>

const ordersContainer = document.getElementById("ordersContainer");


<!-- Firebase Login Protection -->
<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {
        apiKey: "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",
        authDomain: "rk-store-5fb24.firebaseapp.com",
        projectId: "rk-store-5fb24",
        storageBucket: "rk-store-5fb24.firebasestorage.app",
        messagingSenderId: "407275549697",
        appId: "1:407275549697:web:41043b49bf7182cecffc00"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    onAuthStateChanged(auth, (user) => {

        if (!user) {

            window.location.href = "login.html";

        }

    });

</script>
</body>
</html>
