<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RK Store - Orders</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 15px;
            margin: 0;
        }

        .orders-container {
            padding: 20px;
        }

        .search-filter {
            padding: 15px 20px;
            background-color: white;
        }

        .search-filter input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #filterStatus {
            margin: 0 20px 15px 20px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
        }

        .order {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .order h2 {
            color: #ff6600;
        }

        .order p {
            font-size: 16px;
        }

        .status {
            color: #ff6600;
            font-weight: bold;
        }

        .status-select {
            padding: 8px 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            margin-left: 5px;
            cursor: pointer;
        }

        .status-select.pending {
            background-color: #f39c12 !important;
            color: white !important;
        }

        .status-select.confirmed {
            background-color: #3498db !important;
            color: white !important;
        }

        .status-select.shipped {
            background-color: #9b59b6 !important;
            color: white !important;
        }

        .status-select.delivered {
            background-color: #27ae60 !important;
            color: white !important;
        }

        .delete-btn {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background-color: #c62828;
        }

        .view-details-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            margin-right: 5px;
        }

        .view-details-btn:hover {
            background-color: #2980b9;
        }

        .product {
            border-top: 1px solid #ddd;
            padding-top: 10px;
            margin-top: 10px;
        }

        .no-orders {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>RK Store - Orders</h1>

<div class="search-filter">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by name, phone or Order ID..."
        oninput="displayOrders()"
    >
</div>

<select id="filterStatus" onchange="displayOrders()">
    <option value="All">All Orders</option>
    <option value="Pending">Pending</option>
    <option value="Confirmed">Confirmed</option>
    <option value="Shipped">Shipped</option>
    <option value="Delivered">Delivered</option>
</select>

<div class="orders-container" id="ordersContainer"></div>


<script>

function displayOrders() {

    const ordersContainer =
        document.getElementById("ordersContainer");

    const searchText =
        document.getElementById("searchInput").value
        .toLowerCase();

    const filterStatus =
        document.getElementById("filterStatus").value;

    const orders =
        JSON.parse(localStorage.getItem("orders")) || [];

    ordersContainer.innerHTML = "";

    if (orders.length === 0) {

        ordersContainer.innerHTML =
            '<div class="no-orders">' +
            '<h2>No Orders Found</h2>' +
            '<p>There are no orders yet.</p>' +
            '</div>';

        return;
    }


    let foundOrders = 0;


    orders.forEach((order, index) => {

        const orderId =
            order.orderId || ("RK" + (index + 1));


        const customerName =
            order.customerName || "";


        const customerMobile =
            order.customerMobile || "";


        const customerAddress =
            order.customerAddress || "";


        const status =
            order.status || "Pending";


        const statusUpdatedTime =
            order.statusUpdatedTime || "Not updated";


        const searchMatch =

            customerName.toLowerCase()
                .includes(searchText)

            ||

            customerMobile.toLowerCase()
                .includes(searchText)

            ||

            orderId.toLowerCase()
                .includes(searchText);


        const statusMatch =
            filterStatus === "All" ||
            status === filterStatus;


        if (!searchMatch || !statusMatch) {
            return;
        }


        foundOrders++;


        let productsHTML = "";

        let totalAmount = 0;


        if (order.products && order.products.length > 0) {

            order.products.forEach(product => {

                const quantity =
                    Number(product.quantity) || 1;

                const price =
                    Number(product.price) || 0;

                const subtotal =
                    price * quantity;

                totalAmount += subtotal;


                productsHTML += `
                    <div class="product">

                        <p>
                            <strong>Product:</strong>
                            ${product.name || "Product"}
                        </p>

                        <p>
                            <strong>Price:</strong>
                            ৳${price}
                        </p>

                        <p>
                            <strong>Quantity:</strong>
                            ${quantity}
                        </p>

                        <p>
                            <strong>Subtotal:</strong>
                            ৳${subtotal}
                        </p>

                    </div>
                `;

            });

        }


        const orderHTML = `

            <div class="order">

                <h2>Order ID: ${orderId}</h2>

                <p>
                    <strong>Name:</strong>
                    ${customerName}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${customerMobile}
                </p>

                <p>
                    <strong>Address:</strong>
                    ${customerAddress}
                </p>

                <h3>Order Products</h3>

                ${productsHTML}

                <p>
                    <strong>Order Total:</strong>
                    ৳${totalAmount}
                </p>

                <p>
                    <strong>Status:</strong>

                    <select
                        class="status-select ${status.toLowerCase()}"
                        onchange="changeStatus(${index}, this.value)"
                    >

                        <option value="Pending"
                            ${status === "Pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="Confirmed"
                            ${status === "Confirmed" ? "selected" : ""}>
                            Confirmed
                        </option>

                        <option value="Shipped"
                            ${status === "Shipped" ? "selected" : ""}>
                            Shipped
                        </option>

                        <option value="Delivered"
                            ${status === "Delivered" ? "selected" : ""}>
                            Delivered
                        </option>

                    </select>

                </p>

                <p>
                    <strong>Status Updated:</strong>
                    ${statusUpdatedTime}
                </p>


                <button
                    class="view-details-btn"
                    onclick="viewDetails(${index})">
                    View Details
                </button>


                <button
                    class="delete-btn"
                    onclick="deleteOrder(${index})">
                    Delete Order
                </button>

            </div>
        `;


        ordersContainer.innerHTML += orderHTML;

    });


    if (foundOrders === 0) {

        ordersContainer.innerHTML =
            '<div class="no-orders">' +
            '<h2>No Matching Orders</h2>' +
            '<p>No order matches your search or filter.</p>' +
            '</div>';

    }

}


/* Change Order Status */

function changeStatus(index, newStatus) {

    const orders =
        JSON.parse(localStorage.getItem("orders")) || [];


    if (!orders[index]) {
        return;
    }


    orders[index].status = newStatus;


    const now = new Date();


    orders[index].statusUpdatedTime =
        now.toLocaleString();


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    displayOrders();

}


/* Delete Order */

function deleteOrder(index) {

    const confirmDelete =
        confirm("Are you sure you want to delete this order?");


    if (!confirmDelete) {
        return;
    }


    const orders =
        JSON.parse(localStorage.getItem("orders")) || [];


    orders.splice(index, 1);


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    displayOrders();

}


/* View Order Details */

function viewDetails(index) {

    localStorage.setItem(
        "selectedOrderIndex",
        index
    );


    window.location.href =
        "order-details.html";

}


/* Show Orders When Page Loads */

displayOrders();

</script>

</body>
</html>
