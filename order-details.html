<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RK Store - Order Details</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Header */

        .header {
            background-color: #ff6600;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 15px;
        }

        /* Back Button */

        .back-btn {
            display: inline-block;
            background-color: white;
            color: #333;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .back-btn:hover {
            background-color: #eeeeee;
        }

        /* Card */

        .card {
            background-color: white;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .card-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        /* Order Info */

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #eeeeee;
            gap: 15px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #777;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        /* Product */

        .product {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eeeeee;
            align-items: start;
        }

        .product-image {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-info {
            color: #666;
            line-height: 1.7;
        }

        .product-total {
            grid-column: 1 / -1;
            font-weight: bold;
            padding-top: 10px;
            border-top: 1px solid #eeeeee;
        }

        /* Total */

        .total-row {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid #eeeeee;
            font-size: 20px;
            font-weight: bold;
        }

        .total-price {
            color: #ff6600;
        }

        /* Status */

        .status-badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .pending {
            background-color: #f39c12;
        }

        .confirmed {
            background-color: #3498db;
        }

        .shipped {
            background-color: #9b59b6;
        }

        .delivered {
            background-color: #27ae60;
        }

        /* Timeline */

        .timeline {
            margin-top: 10px;
        }

        .timeline-item {
            position: relative;
            padding: 0 0 25px 35px;
            color: #999;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #ccc;
        }

        .timeline-item::after {
            content: "";
            position: absolute;
            left: 13px;
            top: 17px;
            width: 2px;
            height: 35px;
            background-color: #ddd;
        }

        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-item.active {
            color: #333;
            font-weight: bold;
        }

        .timeline-item.active::before {
            background-color: #ff6600;
        }

        .timeline-item.completed {
            color: #27ae60;
            font-weight: bold;
        }

        .timeline-item.completed::before {
            background-color: #27ae60;
        }

        /* Error */

        .error {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        /* Action Buttons */

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .print-btn {
            background-color: #3498db;
        }

        .invoice-btn {
            background-color: #27ae60;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        /* Print */

        @media print {

            .header,
            .back-btn,
            .action-buttons {
                display: none;
            }

            body {
                background-color: white;
            }

            .container {
                max-width: 100%;
                padding: 0;
            }

            .card {
                box-shadow: none;
            }

        }

    </style>

</head>

<body>

    <div class="header">
        RK Store - Order Details
    </div>

    <div class="container">

        <a
            href="orders.html"
            class="back-btn"
        >
            ← Back to Orders
        </a>

        <div id="orderDetails"></div>

        <!-- Action Buttons -->

        <div class="action-buttons">

            <button
                type="button"
                class="action-btn print-btn"
                onclick="printOrder()"
            >
                🖨️ Print Order
            </button>

            <button
                type="button"
                class="action-btn invoice-btn"
                onclick="printInvoice()"
            >
                📄 Print Invoice
            </button>

        </div>

    </div>


<script>

    /* =========================
       GET ORDER FROM URL
    ========================= */

    /* =========================
   GET ORDER INDEX
========================= */

// First check URL
const urlParams =
    new URLSearchParams(window.location.search);

let orderIndex =
    urlParams.get("order");

// If URL does not contain order index,
// get it from localStorage
if (orderIndex === null) {
    orderIndex =
        localStorage.getItem("selectedOrderIndex");
}

// Convert to number
if (orderIndex !== null) {
    orderIndex = Number(orderIndex);
}


    /* =========================
       GET ORDERS
    ========================= */

    const orders =
        JSON.parse(localStorage.getItem("orders")) || [];


    const orderDetails =
        document.getElementById("orderDetails");


    /* =========================
       CHECK ORDER
    ========================= */

    if (
        orderIndex === null ||
        !orders[orderIndex]
    ) {

        orderDetails.innerHTML = `

            <div class="error">

                <h2>
                    Order Not Found
                </h2>

                <p>
                    The requested order could not be found.
                </p>

            </div>

        `;

    } else {

        const order =
            orders[orderIndex];


        const orderStatus =
            order.status || "Pending";


        /* =========================
           ORDER TOTAL
        ========================= */

        let orderTotal = 0;

        let productsHTML = "";


        if (
            order.products &&
            order.products.length > 0
        ) {

            order.products.forEach(
                (product, index) => {

                    const quantity =
                        product.quantity || 1;

                    const price =
                        product.price || 0;

                    const total =
                        price * quantity;


                    orderTotal += total;


                    productsHTML += `

                        <div class="product">

                            <img
                                src="${
                                    product.image ||
                                    "product1.jpg"
                                }"
                                alt="${
                                    product.name ||
                                    "Product"
                                }"
                                class="product-image"
                            >

                            <div>

                                <div class="product-name">

                                    ${
                                        product.name ||
                                        "Product " +
                                        (index + 1)
                                    }

                                </div>

                                <div class="product-info">

                                    Quantity:
                                    <strong>
                                        ${quantity}
                                    </strong>

                                    <br>

                                    Price:
                                    <strong>
                                        ৳${price}
                                    </strong>

                                </div>

                            </div>

                            <div class="product-total">

                                Subtotal:
                                ৳${total}

                            </div>

                        </div>

                    `;

                }
            );

        } else {

            productsHTML = `
                <p>
                    No products found.
                </p>
            `;

        }


        /* =========================
           STATUS TIMELINE
        ========================= */

        const statusOrder = [
            "Pending",
            "Confirmed",
            "Shipped",
            "Delivered"
        ];


        const currentStatusIndex =
            statusOrder.indexOf(orderStatus);


        let timelineHTML = "";


        statusOrder.forEach(
            (status, index) => {

                let className = "";


                if (
                    currentStatusIndex >= 0 &&
                    index < currentStatusIndex
                ) {

                    className = "completed";

                } else if (
                    index === currentStatusIndex
                ) {

                    className = "active";

                }


                timelineHTML += `

                    <div
                        class="timeline-item ${className}"
                    >

                        ${status}

                    </div>

                `;

            }
        );


        /* =========================
           DISPLAY ORDER
        ========================= */

        orderDetails.innerHTML = `

            <!-- Order Information -->

            <div class="card">

                <div class="card-title">
                    Order Information
                </div>

                <div class="info-row">

                    <span class="label">
                        Order ID
                    </span>

                    <span class="value">
                        ${
                            order.orderId ||
                            "Not available"
                        }
                    </span>

                </div>

                <div class="info-row">

                    <span class="label">
                        Order Date
                    </span>

                    <span class="value">
                        ${
                            order.dateTime ||
                            "Not available"
                        }
                    </span>

                </div>

                <div class="info-row">

                    <span class="label">
                        Status
                    </span>

                    <span class="value">

                        <span
                            class="status-badge ${
                                orderStatus.toLowerCase()
                            }"
                        >
                            ${orderStatus}
                        </span>

                    </span>

                </div>

                <div class="info-row">

    <span class="label">
        Status Updated
    </span>

    <span class="value">
        ${
            order.statusUpdatedTime ||
            "Not updated"
        }
    </span>

</div>

            </div>


            <!-- Customer Information -->

            <div class="card">

                <div class="card-title">
                    Customer Information
                </div>

                <div class="info-row">

                    <span class="label">
                        Name
                    </span>

                    <span class="value">
                        ${
                            order.customerName ||
                            "Not available"
                        }
                    </span>

                </div>

                <div class="info-row">

                    <span class="label">
                        Phone
                    </span>

                    <span class="value">
                        ${
                            order.customerMobile ||
                            "Not available"
                        }
                    </span>

                </div>

                <div class="info-row">

                    <span class="label">
                        Address
                    </span>

                    <span class="value">
                        ${
                            order.customerAddress ||
                            "Not available"
                        }
                    </span>

                </div>

            </div>


            <!-- Payment Information -->

            <div class="card">

                <div class="card-title">
                    Payment Information
                </div>

                <div class="info-row">

                    <span class="label">
                        Payment Method
                    </span>

                    <span class="value">

                        ${
                            order.paymentMethod === "bkash"
                                ? "bKash"
                                : order.paymentMethod === "nagad"
                                    ? "Nagad"
                                    : "Cash on Delivery"
                        }

                    </span>

                </div>


                ${
                    order.paymentMethod === "bkash" ||
                    order.paymentMethod === "nagad"

                    ? `

                        <div class="info-row">

                            <span class="label">
                                Payment Number
                            </span>

                            <span class="value">
                                ${
                                    order.paymentNumber ||
                                    "Not available"
                                }
                            </span>

                        </div>


                        <div class="info-row">

                            <span class="label">
                                Transaction ID
                            </span>

                            <span class="value">
                                ${
                                    order.transactionId ||
                                    "Not available"
                                }
                            </span>

                        </div>

                    `

                    : ""

                }

            </div>


            <!-- Ordered Products -->

            <div class="card">

                <div class="card-title">
                    Ordered Products
                </div>

                ${productsHTML}

                <div class="total-row">

                    <span>
                        Total Amount
                    </span>

                    <span class="total-price">
                        ৳${orderTotal}
                    </span>

                </div>

            </div>


            <!-- Order Status -->

            <div class="card">

                <div class="card-title">
                    Order Status
                </div>

                <div class="timeline">

                    ${timelineHTML}

                </div>

            </div>

        `;

    }


    /* =========================
       PRINT ORDER
    ========================= */

    function printOrder() {

        window.print();

    }


    /* =========================
       PRINT INVOICE
    ========================= */

    function printInvoice() {

    const order = orders[orderIndex];

    if (!order) {
        alert("Order not found.");
        return;
    }

    let invoiceProducts = "";
    let invoiceTotal = 0;

    if (order.products && order.products.length > 0) {

        order.products.forEach((product, index) => {

            const quantity = product.quantity || 1;
            const price = product.price || 0;
            const subtotal = price * quantity;

            invoiceTotal += subtotal;

            invoiceProducts += `
                <tr>
                    <td>
                        ${product.name || "Product " + (index + 1)}
                    </td>

                    <td>
                        ${quantity}
                    </td>

                    <td>
                        ৳${price}
                    </td>

                    <td>
                        ৳${subtotal}
                    </td>
                </tr>
            `;
        });

    } else {

        invoiceProducts = `
            <tr>
                <td colspan="4">
                    No products found.
                </td>
            </tr>
        `;
    }


    const paymentMethod =
        order.paymentMethod === "bkash"
            ? "bKash"
            : order.paymentMethod === "nagad"
                ? "Nagad"
                : "Cash on Delivery";


    const invoiceWindow = window.open("", "_blank");

    if (!invoiceWindow) {

        alert(
            "Please allow pop-ups for this website."
        );

        return;
    }


    invoiceWindow.document.write(`
