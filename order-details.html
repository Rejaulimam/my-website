<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RK Store - Order Details</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Header */

        .header {
            background-color: #ff6600;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 15px;
        }

        /* Back Button */

        .back-btn {
            display: inline-block;
            background-color: white;
            color: #333;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .back-btn:hover {
            background-color: #eeeeee;
        }

        /* Card */

        .card {
            background-color: white;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .card-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        /* Order Info */

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #eeeeee;
            gap: 15px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #777;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        /* Product */

        .product {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eeeeee;
            align-items: start;
        }

        .product-image {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-info {
            color: #666;
            line-height: 1.7;
        }

        .product-total {
            grid-column: 1 / -1;
            font-weight: bold;
            padding-top: 10px;
            border-top: 1px solid #eeeeee;
        }

        /* Total */

        .total-row {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid #eeeeee;
            font-size: 20px;
            font-weight: bold;
        }

        .total-price {
            color: #ff6600;
        }

        /* Status */

        .status-badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .pending {
            background-color: #f39c12;
        }

        .confirmed {
            background-color: #3498db;
        }

        .shipped {
            background-color: #9b59b6;
        }

        .delivered {
            background-color: #27ae60;
        }

        /* Timeline */

        .timeline {
            margin-top: 10px;
        }

        .timeline-item {
            position: relative;
            padding: 0 0 25px 35px;
            color: #999;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #ccc;
        }

        .timeline-item::after {
            content: "";
            position: absolute;
            left: 13px;
            top: 17px;
            width: 2px;
            height: 35px;
            background-color: #ddd;
        }

        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-item.active {
            color: #333;
            font-weight: bold;
        }

        .timeline-item.active::before {
            background-color: #ff6600;
        }

        .timeline-item.completed {
            color: #27ae60;
            font-weight: bold;
        }

        .timeline-item.completed::before {
            background-color: #27ae60;
        }

        /* Error */

        .error {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        /* Action Buttons */

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .print-btn {
            background-color: #3498db;
        }

        .invoice-btn {
            background-color: #27ae60;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        /* Security Loading */

        #securityLoading {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Initially hide protected content */

        #protectedContent {
            display: none;
        }

        /* Print */

        @media print {

            .header,
            .back-btn,
            .action-buttons {
                display: none;
            }

            body {
                background-color: white;
            }

            .container {
                max-width: 100%;
                padding: 0;
            }

            .card {
                box-shadow: none;
            }

        }

    </style>

</head>

<body>

    <div class="header">
        RK Store - Order Details
    </div>


    <div class="container">


        <!-- =========================
             SECURITY CHECK
        ========================= -->

        <div id="securityLoading">

            🔐 Checking Admin Login...

        </div>


        <!-- =========================
             PROTECTED CONTENT
        ========================= -->

        <div id="protectedContent">

            <div class="action-buttons">

                <button

                <button

                    class="action-btn invoice-btn"

    </div>


<script type="module">


/* =====================================================

    getDoc,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

    authDomain:
        "rk-store-5fb24.firebaseapp.com",

    projectId:
        "rk-store-5fb24",

    storageBucket:
        "rk-store-5fb24.firebasestorage.app",

    messagingSenderId:
        "407275549697",

    appId:
        "1:407275549697:web:41043b49bf7182cecffc00"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
    "REJAUL.IMAM@gmail.com";


/* =====================================================
   ELEMENTS
===================================================== */

const securityLoading =
    document.getElementById(
        "securityLoading"
    );


const protectedContent =
    document.getElementById(
        "protectedContent"
    );


const orderDetails =
    document.getElementById(
        "orderDetails"
    );


/* =====================================================
   ADMIN AUTH CHECK
===================================================== */

onAuthStateChanged(

    auth,

    async function(user) {


        /* =========================
           NOT LOGGED IN
        ========================= */

        if (!user) {

            window.location.replace(
                "admin-login.html"
            );

            return;

        }


        /* =========================
           ADMIN EMAIL CHECK
        ========================= */

        if (
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            window.location.replace(
                "admin-login.html"
            );

            return;

        }


        /* =========================
           ADMIN VERIFIED
        ========================= */

        console.log(
            "Admin verified for Order Details:",
            user.email
        );


        securityLoading.style.display =
            "none";


        protectedContent.style.display =
            "block";


        /* =========================
           LOAD ORDER FROM FIRESTORE
        ========================= */

        await loadOrderDetails();

    }

);


/* =====================================================
   SHOW ERROR
===================================================== */

function showOrderError(message) {

    orderDetails.innerHTML = `

        <div class="error">

            <h2>
                Order Not Found
            </h2>

            <p>
                ${message}
            </p>

        </div>

    `;

}


/* =====================================================
   LOAD ORDER FROM FIRESTORE
===================================================== */

async function loadOrderDetails() {

    try {


        /* =========================
           GET URL PARAMETERS
        ========================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const orderId =
            urlParams.get("orderId");


        const documentId =
            urlParams.get("id");


        const orderParameter =
            urlParams.get("order");


        let order = null;


        let firestoreDocumentId = null;


        /* =================================================
           METHOD 1
           FIRESTORE DOCUMENT ID
        ================================================= */

        if (documentId) {

            console.log(
                "Loading order by Firestore document ID:",
                documentId
            );


            const orderRef =
                doc(
                    db,
                    "orders",
                    documentId
                );


            const orderSnap =
                await getDoc(
                    orderRef
                );


            if (orderSnap.exists()) {

                order =
                    orderSnap.data();

                firestoreDocumentId =
                    orderSnap.id;

            }

        }


        /* =================================================
           METHOD 2
           ORDER ID
        ================================================= */

        if (
            !order &&
            orderId
        ) {

            console.log(
                "Loading order by Order ID:",
                orderId
            );


            const ordersRef =
                collection(
                    db,
                    "orders"
                );


            const q =
                query(
                    ordersRef,
                    where(
                        "orderId",
                        "==",
                        orderId
                    )
                );


            const snapshot =
                await getDocs(q);


            if (
                !snapshot.empty
            ) {

                const firstDoc =
                    snapshot.docs[0];


                order =
                    firstDoc.data();

                firestoreDocumentId =
                    firstDoc.id;

            }

        }


        /* =================================================
           METHOD 3
           OLD ?order= PARAMETER
           
           If the old orders.html still sends
           ?order=0, ?order=1, etc.,
           we try to find the order directly
           from Firestore.
        ================================================= */

        if (
            !order &&
            orderParameter !== null
        ) {


            /* =========================
               TRY AS FIRESTORE DOCUMENT ID
            ========================= */

            const possibleDocId =
                orderParameter;


            try {

                const orderRef =
                    doc(
                        db,
                        "orders",
                        possibleDocId
                    );


                const orderSnap =
                    await getDoc(
                        orderRef
                    );


                if (
                    orderSnap.exists()
                ) {

                    order =
                        orderSnap.data();

                    firestoreDocumentId =
                        orderSnap.id;

                }

            } catch (docError) {

                console.log(
                    "Document ID lookup skipped:",
                    docError
                );

            }


            /* =========================
               TRY OLD NUMERIC INDEX
            ========================= */

            if (
                !order &&
                /^\d+$/.test(
                    orderParameter
                )
            ) {

                const ordersRef =
                    collection(
                        db,
                        "orders"
                    );


                const snapshot =
                    await getDocs(
                        ordersRef
                    );


                const index =
                    Number(
                        orderParameter
                    );


                if (
                    index >= 0 &&
                    index <
                    snapshot.docs.length
                ) {

                    const selectedDoc =
                        snapshot.docs[index];


                    order =
                        selectedDoc.data();

                    firestoreDocumentId =
                        selectedDoc.id;

                }

            }

        }


        /* =================================================
           CHECK ORDER
        ================================================= */

        if (!order) {

            showOrderError(
                "The requested order could not be found in Firestore."
            );

            return;

        }


        console.log(
            "Order loaded from Firestore:",
            firestoreDocumentId
        );


        /* =================================================
           DISPLAY ORDER
        ================================================= */

        displayOrder(
            order
        );


        /* =================================================
           STORE CURRENT ORDER
           ONLY FOR PRINT FUNCTIONS
        ================================================= */

        window.currentOrder =
            order;


        window.currentOrderDocumentId =
            firestoreDocumentId;


    } catch (error) {

        console.error(
            "Firestore Order Details Error:",
            error
        );


        orderDetails.innerHTML = `

            <div class="error">

                <h2>
                    Unable to Load Order
                </h2>

                <p>
                    Something went wrong while loading the order.
                </p>

                <p style="color:#d00; font-size:13px;">

                    ${error.message || ""}

                </p>

            </div>

        `;

    }

}


/* =====================================================
   DISPLAY ORDER
===================================================== */

function displayOrder(order) {


    const orderStatus =
        order.status ||
        "Pending";


    /* =========================
       ORDER TOTAL
    ========================= */

    let orderTotal =
        0;


    let productsHTML =
        "";


    if (
        order.products &&
        Array.isArray(order.products) &&
        order.products.length > 0
    ) {


        order.products.forEach(
            (product, index) => {


                const quantity =
                    Number(
                        product.quantity
                    ) || 1;


                const price =
                    Number(
                        product.price
                    ) || 0;


                const total =
                    price *
                    quantity;

const productImage =
    product.image ||
    product.imageUrl ||
    product.img ||
    (
        product.productId
            ? "./product" + product.productId + "/product1.jpg"
            : ""
    );


                orderTotal +=
                    total;


                productsHTML += `

                    <div class="product">


                        <img
                            src="${productImage}"

                            alt="${
                                product.name ||
                                "Product"
                            }"
                            class="product-image"
                        >


                        <div>

                            <div class="product-name">

                                ${
                                    product.name ||
                                    "Product " +
                                    (index + 1)
                                }

                            </div>


                            <div class="product-info">

                                Product Serial:

                                <strong style="color:#ff6600;">

                                    ${
                                        product.productSerial ||
                                        product.productId ||
                                        "N/A"
                                    }

                                </strong>

                            </div>


                            <div class="product-info">

                                Quantity:

                                <strong>
                                    ${quantity}
                                </strong>

                                <br>

                                Price:

                                <strong>
                                    ৳${price}
                                </strong>

                            </div>

                        </div>


                        <div class="product-total">

                            Subtotal:
                            ৳${total}

                        </div>

                    </div>

                `;

            }
        );


    } else {


        productsHTML = `

            <p>
                No products found.
            </p>

        `;

    }


    /* =================================================
       STATUS TIMELINE
    ================================================= */

    const statusOrder = [

        "Pending",

        "Confirmed",

        "Shipped",

        "Delivered"

    ];


    const currentStatusIndex =
        statusOrder.indexOf(
            orderStatus
        );


    let timelineHTML =
        "";


    statusOrder.forEach(
        (status, index) => {


            let className =
                "";


            if (
                currentStatusIndex >= 0 &&
                index < currentStatusIndex
            ) {

                className =
                    "completed";

            }


            else if (
                index ===
                currentStatusIndex
            ) {

                className =
                    "active";

            }


            timelineHTML += `

                <div
                    class="timeline-item ${className}"
                >

                    ${status}

                </div>

            `;

        }
    );


    /* =================================================
       DISPLAY ORDER
    ================================================= */

    orderDetails.innerHTML = `


        <!-- Order Information -->

        <div class="card">

            <div class="card-title">
                Order Information
            </div>


            <div class="info-row">

                <span class="label">
                    Order ID
                </span>


                <span class="value">

                    ${
                        order.orderId ||
                        "Not available"
                    }

                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Order Date
                </span>


                <span class="value">

                    ${
                        order.dateTime ||
                        "Not available"
                    }

                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Status
                </span>


                <span class="value">

                    <span
                        class="status-badge ${
                            orderStatus.toLowerCase()
                        }"
                    >

                        ${orderStatus}

                    </span>

                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Status Updated
                </span>


                <span class="value">

                    ${
                        order.statusUpdatedTime ||
                        "Not updated"
                    }

                </span>

            </div>

        </div>


        <!-- Customer Information -->

        <div class="card">

            <div class="card-title">
                Customer Information
            </div>


            <div class="info-row">

                <span class="label">
                    Name
                </span>


                <span class="value">

                    ${
                        order.customerName ||
                        "Not available"
                    }

                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Phone
                </span>


                <span class="value">

                    ${
                        order.customerMobile ||
                        "Not available"
                    }

                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Address
                </span>


                <span class="value">

                    ${
                        order.customerAddress ||
                        "Not available"
                    }

                </span>

            </div>

        </div>


        <!-- Payment Information -->

        <div class="card">

            <div class="card-title">
                Payment Information
            </div>


            <div class="info-row">

                <span class="label">
                    Payment Method
                </span>


                <span class="value">

                    ${
                        order.paymentMethod === "bkash"
                            ? "bKash"
                            : order.paymentMethod === "nagad"
                                ? "Nagad"
                                : "Cash on Delivery"
                    }

                </span>

            </div>


            ${
                order.paymentMethod === "bkash" ||
                order.paymentMethod === "nagad"

                ? `

                    <div class="info-row">

                        <span class="label">
                            Payment Number
                        </span>


                        <span class="value">

                            ${
                                order.paymentNumber ||
                                "Not available"
                            }

                        </span>

                    </div>


                    <div class="info-row">

                        <span class="label">
                            Transaction ID
                        </span>


                        <span class="value">

                            ${
                                order.transactionId ||
                                "Not available"
                            }

                        </span>

                    </div>

                `

                : ""

            }

        </div>


        <!-- Ordered Products -->

        <div class="card">

            <div class="card-title">
                Ordered Products
            </div>


            ${productsHTML}


            <div class="total-row">

                <span>
                    Total Amount
                </span>


                <span class="total-price">

                    ৳${orderTotal}

                </span>

            </div>

        </div>


        <!-- Order Status -->

        <div class="card">

            <div class="card-title">
                Order Status
            </div>


            <div class="timeline">

                ${timelineHTML}

            </div>

        </div>

    `;

}


/* =====================================================
   PRINT ORDER
===================================================== */

window.printOrder =
    function() {

        if (
            !window.currentOrder
        ) {

            alert(
                "Order not found."
            );

            return;

        }


        window.print();

    };


/* =====================================================
   PRINT INVOICE
===================================================== */

window.printInvoice =
    function() {


        const order =
            window.currentOrder;


        if (!order) {

            alert(
                "Order not found."
            );

            return;

        }


        let invoiceProducts =
            "";


        let invoiceTotal =
            0;


        if (
            order.products &&
            Array.isArray(order.products) &&
            order.products.length > 0
        ) {


            order.products.forEach(
                (product, index) => {


                    const quantity =
                        Number(
                            product.quantity
                        ) || 1;


                    const price =
                        Number(
                            product.price
                        ) || 0;


                    const subtotal =
                        price *
                        quantity;


                    invoiceTotal +=
                        subtotal;


                    invoiceProducts += `

                        <tr>

                            <td>

                                ${
                                    product.name ||
                                    "Product " +
                                    (index + 1)
                                }

                            </td>


                            <td>

                                ${quantity}

                            </td>


                            <td>

                                ৳${price}

                            </td>


                            <td>

                                ৳${subtotal}

                            </td>

                        </tr>

                    `;

                }
            );


        } else {


            invoiceProducts = `

                <tr>

                    <td colspan="4">

                        No products found.

                    </td>

                </tr>

            `;

        }


        const paymentMethod =

            order.paymentMethod === "bkash"

                ? "bKash"

                : order.paymentMethod === "nagad"

                    ? "Nagad"

                    : "Cash on Delivery";


        const invoiceWindow =
            window.open(
                "",
                "_blank"
            );


        if (!invoiceWindow) {

            alert(
                "Please allow pop-ups for this website."
            );

            return;

        }


        invoiceWindow.document.write(`

    gap: 15px;
    padding: 7px 0;
    border-bottom: 1px solid #eee;
}

.info-row:last-child {
    border-bottom: none;
}

.info-label {
    color: #777;
}

.info-value {
    font-weight: bold;
    text-align: right;
}


/* Products */

.section-title {
    font-size: 19px;
    font-weight: bold;
    margin: 25px 0 10px;
}

.products-table {
    width: 100%;
    border-collapse: collapse;
}

.products-table th,
.products-table td {
    border: 1px solid #ddd;
    padding: 11px;
}

.products-table th {
    background: #ff6600;
    color: white;
    text-align: left;
}

.products-table td:nth-child(2),
.products-table td:nth-child(3),
.products-table td:nth-child(4),
.products-table th:nth-child(2),
.products-table th:nth-child(3),
.products-table th:nth-child(4) {
    text-align: center;
}


/* Total */

.total-box {
    margin-top: 20px;
    margin-left: auto;
    max-width: 350px;
    border-top: 2px solid #333;
    padding-top: 12px;
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: bold;
}

.total-price {
    color: #ff6600;
}


/* Footer */

.footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #ddd;
    color: #777;
}

.footer strong {
    color: #ff6600;
}


/* Print */

@media print {

    body {
        background: white;
        padding: 0;
    }

    .invoice {
        max-width: 100%;
        box-shadow: none;
        padding: 15px;
    }

}


@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .invoice {
        padding: 18px;
    }

    .invoice-header {
        display: block;
    }

    .invoice-title {
        text-align: left;
        margin-top: 10px;
    }

    .info-section {
        grid-template-columns: 1fr;
    }

    .products-table {
        font-size: 13px;
    }

    .products-table th,
    .products-table td {
        padding: 7px;
    }

}


.invoice-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
}

.invoice-buttons button {
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    color: white;
    background-color: #3498db;
}

.invoice-buttons button:last-child {
    background-color: #e74c3c;
}

.invoice-buttons button:hover {
    opacity: 0.9;
}


@media print {

    .invoice-buttons {
        display: none;
    }

}

</style>

</head>


<body>

<div class="invoice">


    <!-- Header -->

    <div class="invoice-header">

        <div>

            <div class="store-name">
                RK Store
            </div>

            <div>
                Thank you for shopping with us
            </div>

        </div>


        <div class="invoice-title">

            <h2>
                INVOICE
            </h2>

            <p>
                Order Invoice
            </p>

        </div>

    </div>


    <!-- Information -->

    <div class="info-section">


        <!-- Order -->

        <div class="info-box">

            <h3>
                Order Information
            </h3>


            <div class="info-row">

                <span class="info-label">
                    Order ID
                </span>


                <span class="info-value">

                    ${
                        order.orderId ||
                        "Not available"
                    }

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Order Date
                </span>


                <span class="info-value">

                    ${
                        order.dateTime ||
                        "Not available"
                    }

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Status
                </span>


                <span class="info-value">

                    ${
                        order.status ||
                        "Pending"
                    }

                </span>

            </div>

        </div>


        <!-- Customer -->

        <div class="info-box">

            <h3>
                Customer Information
            </h3>


            <div class="info-row">

                <span class="info-label">
                    Name
                </span>


                <span class="info-value">

                    ${
                        order.customerName ||
                        "Not available"
                    }

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Phone
                </span>


                <span class="info-value">

                    ${
                        order.customerMobile ||
                        "Not available"
                    }

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Address
                </span>


                <span class="info-value">

                    ${
                        order.customerAddress ||
                        "Not available"
                    }

                </span>

            </div>

        </div>

    </div>


    <!-- Payment -->

    <div class="info-box">

        <h3>
            Payment Information
        </h3>


        <div class="info-row">

            <span class="info-label">
                Payment Method
            </span>


            <span class="info-value">

                ${paymentMethod}

            </span>

        </div>


        ${
            order.paymentNumber
            ? `

                <div class="info-row">

                    <span class="info-label">
                        Payment Number
                    </span>


                    <span class="info-value">

                        ${order.paymentNumber}

                    </span>

                </div>

            `
            : ""
        }


        ${
            order.transactionId
            ? `

                <div class="info-row">

                    <span class="info-label">
                        Transaction ID
                    </span>


                    <span class="info-value">

                        ${order.transactionId}

                    </span>

                </div>

            `
            : ""
        }

    </div>


    <!-- Products -->

    <div class="section-title">
        Ordered Products
    </div>


    <table class="products-table">

        <thead>

            <tr>

                <th>
                    Product
                </th>

                <th>
                    Quantity
                </th>

                <th>
                    Price
                </th>

                <th>
                    Subtotal
                </th>

            </tr>

        </thead>


        <tbody>

            ${invoiceProducts}

        </tbody>

    </table>


    <!-- Total -->

    <div class="total-box">

        <div class="total-row">

            <span>
                Total Amount
            </span>


            <span class="total-price">

                ৳${invoiceTotal}

            </span>

        </div>

    </div>


    <div class="invoice-buttons">

        <button
            onclick="window.print()"
        >
            🖨️ Print Invoice
        </button>


        <button
            onclick="window.close()"
        >
            ✖ Close
        </button>

    </div>


    <!-- Footer -->

    <div class="footer">

        <strong>
            RK Store
        </strong>

        <br>

        Thank you for your purchase!

    </div>


</div>

</body>

</html>

        invoiceWindow.document.close();

        invoiceWindow.focus();

    };


</script>


</body>
