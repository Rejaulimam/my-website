<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - RK Store</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: #ff6600;

            color: white;

            padding: 18px;

            text-align: center;

        }


        .header h1 {

            margin: 0;

        }


        .header p {

            margin: 6px 0 0;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 92%;

            max-width: 850px;

            margin: 25px auto;

        }


        /* =========================
           ORDER FILTER BOX
        ========================= */

        .filter-box {

            background: white;

            padding: 18px;

            margin-bottom: 18px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }


        .filter-title {

            font-size: 22px;

            font-weight: bold;

            color: #ff6600;

            margin: 0;

        }


        .status-select {

            width: 250px;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            cursor: pointer;

        }


        /* =========================
           ORDER CARD
        ========================= */

        .order-card {

            background: white;

            padding: 18px;

            margin-bottom: 18px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

        }


        .order-card h2 {

            margin-top: 0;

            color: #ff6600;

        }


        .order-info {

            margin: 8px 0;

            color: #444;

        }


        /* =========================
           PRODUCT
        ========================= */

        .product {

            border-top: 1px solid #ddd;

            padding: 15px 0;

        }


        .product:first-child {

            border-top: none;

        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image {

            width: 110px;

            height: 110px;

            object-fit: cover;

            border-radius: 8px;

            border: 1px solid #ddd;

            display: block;

            margin-bottom: 10px;

            background: #f5f5f5;

        }


        .product-image-placeholder {

            width: 110px;

            height: 110px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            border: 1px solid #ddd;

            background: #f5f5f5;

            color: #999;

            font-size: 13px;

            text-align: center;

            margin-bottom: 10px;

        }


        /* =========================
           TOTAL
        ========================= */

        .total {

            text-align: right;

            font-size: 18px;

            font-weight: bold;

            margin-top: 15px;

        }


        /* =========================
           STATUS
        ========================= */

        .status {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: #fff3cd;

            color: #856404;

            font-weight: bold;

        }


        /* =========================
           VIEW DETAILS
        ========================= */

        .view-details-button {

            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border: none;

            border-radius: 6px;

            background: #ff6600;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        .view-details-button:hover {

            background: #e65c00;

        }


        /* =========================
           LOADING
        ========================= */

        #loading {

            text-align: center;

            color: #666;

            padding: 30px;

        }


        /* =========================
           NO ORDERS
        ========================= */

        #noOrders {

            display: none;

            background: white;

            padding: 25px;

            text-align: center;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

        }


        .start-shopping-button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #ff6600;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        .start-shopping-button:hover {

            background: #e65c00;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {

                width: 94%;

            }


            .filter-box {

                flex-direction: column;

                align-items: stretch;

            }


            .filter-title {

                text-align: left;

                font-size: 20px;

            }


            .status-select {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>RK Store</h1>

        <p>My Orders</p>

    </div>


    <div class="container">


        <!-- =========================
             ORDER FILTER
        ========================= -->

        <div class="filter-box">

            <h2
                id="filterTitle"
                class="filter-title"
            >

                All Orders

            </h2>


            <select
                id="statusFilter"
                class="status-select"
            >

                <option value="">
                    All Orders
                </option>


                <option value="Pending">
                    Pending Order
                </option>


                <option value="Confirmed">
                    Confirm Order
                </option>


                <option value="Cancelled">
                    Cancel Order
                </option>


                <option value="Shipped">
                    Shipped Order
                </option>


                <option value="Delivered">
                    Delivered Order
                </option>

            </select>

        </div>


        <!-- =========================
             LOADING
        ========================= -->

        <div id="loading">

            Loading your orders...

        </div>


        <!-- =========================
             ORDERS
        ========================= -->

        <div id="ordersContainer"></div>


        <!-- =========================
             NO ORDERS
        ========================= -->

        <div id="noOrders">

            <h2>No Orders Found</h2>

            <p id="noOrdersText">

                You haven't placed any orders yet.

            </p>


            <button
                class="start-shopping-button"
                onclick="goHome()"
            >

                Start Shopping

            </button>

        </div>


    </div>



<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {

    initializeApp

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

    getFirestore,

    collection,

    query,

    where,

    getDocs

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {

    getAuth,

    onAuthStateChanged

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

    authDomain:
        "rk-store-5fb24.firebaseapp.com",

    projectId:
        "rk-store-5fb24",

    storageBucket:
        "rk-store-5fb24.firebasestorage.app",

    messagingSenderId:
        "407275549697",

    appId:
        "1:407275549697:web:41043b49bf7182cecffc00"

};



/* ==================================================
   INITIALIZE FIREBASE
================================================== */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const auth =
    getAuth(app);



/* ==================================================
   ELEMENTS
================================================== */

const filterTitle =
    document.getElementById(
        "filterTitle"
    );


const statusFilter =
    document.getElementById(
        "statusFilter"
    );


const loading =
    document.getElementById(
        "loading"
    );


const container =
    document.getElementById(
        "ordersContainer"
    );


const noOrders =
    document.getElementById(
        "noOrders"
    );


const noOrdersText =
    document.getElementById(
        "noOrdersText"
    );



/* ==================================================
   URL STATUS
================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const selectedStatus =
    urlParams.get("status") || "";


statusFilter.value =
    selectedStatus;



/* ==================================================
   FILTER TITLE
================================================== */

function updateFilterTitle() {

    if (!selectedStatus) {

        filterTitle.innerText =
            "All Orders";

        return;

    }


    if (selectedStatus === "Pending") {

        filterTitle.innerText =
            "Pending Order";

    }

    else if (selectedStatus === "Confirmed") {

        filterTitle.innerText =
            "Confirm Order";

    }

    else if (selectedStatus === "Cancelled") {

        filterTitle.innerText =
            "Cancel Order";

    }

    else if (selectedStatus === "Shipped") {

        filterTitle.innerText =
            "Shipped Order";

    }

    else if (selectedStatus === "Delivered") {

        filterTitle.innerText =
            "Delivered Order";

    }

    else {

        filterTitle.innerText =
            "All Orders";

    }

}


updateFilterTitle();



/* ==================================================
   DROPDOWN CHANGE
================================================== */

statusFilter.addEventListener(
    "change",
    function() {

        const status =
            this.value;


        if (status === "") {

            window.location.href =
                "customer-orders.html";

        }

        else {

            window.location.href =
                "customer-orders.html?status=" +
                encodeURIComponent(status);

        }

    }
);



/* ==================================================
   AUTH CHECK
================================================== */

/*
   IMPORTANT:

   এখানে কোনো Login Page-এ Redirect নেই।

   Customer Login Button থেকে একবার Login করলে
   Firebase browserLocalPersistence-এর কারণে
   session browser-এ থাকবে।

   এরপর Home → My Orders গেলে
   সরাসরি তার নিজের Orders দেখাবে।

   Logout না করা পর্যন্ত My Orders থেকে
   কোনো Password চাইবে না।
*/

onAuthStateChanged(

    auth,

    async function(user) {

        if (user) {

            await loadCustomerOrders(
                user.uid
            );

        }

        else {

            /*
               My Orders নিজে কোনো Login Page
               খুলবে না।

               Login না থাকলে শুধু message দেখাবে।
            */

            loading.style.display =
                "none";


            noOrders.style.display =
                "block";


            noOrdersText.innerText =
                "Please login from Customer Login to view your orders.";

        }

    }

);



/* ==================================================
   LOAD CUSTOMER ORDERS
================================================== */

async function loadCustomerOrders(
    customerId
) {

    try {

        const ordersQuery =
            query(

                collection(
                    db,
                    "orders"
                ),

                where(
                    "customerId",
                    "==",
                    customerId
                )

            );


        const snapshot =
            await getDocs(
                ordersQuery
            );


        loading.style.display =
            "none";


        let ordersHTML = "";

        let matchingOrders = 0;



        /* ==================================================
           READ ORDERS
        ================================================== */

        snapshot.forEach(

            function(doc) {

                const order =
                    doc.data();


                const orderStatus =
                    order.status ||
                    "Pending";



                /* ==================================================
                   STATUS FILTER
                ================================================== */

                if (

                    selectedStatus !== "" &&

                    orderStatus !==
                    selectedStatus

                ) {

                    return;

                }


                matchingOrders++;



                /* ==================================================
                   PRODUCTS
                ================================================== */

                let productsHTML =
                    "";


                if (
                    Array.isArray(
                        order.products
                    )
                ) {

                    order.products.forEach(

                        function(product) {

                            const price =
                                Number(
                                    product.price
                                ) || 0;


                            const quantity =
                                Number(
                                    product.quantity
                                ) || 1;


                            const subtotal =
                                price *
                                quantity;



                            /* =========================
                               PRODUCT IMAGE
                            ========================= */

                            let productImageHTML =
                                "";


                            if (
                                product.image
                            ) {

                                productImageHTML = `

                                    <img
                                        class="product-image"
                                        src="${product.image}"
                                        alt="${
                                            product.name ||
                                            "Product"
                                        }"
                                        onerror="
                                            this.style.display='none';
                                            this.nextElementSibling.style.display='flex';
                                        "
                                    >

                                    <div
                                        class="product-image-placeholder"
                                        style="display:none;"
                                    >

                                        Image not available

                                    </div>

                                `;

                            }

                            else {

                                productImageHTML = `

                                    <div
                                        class="product-image-placeholder"
                                    >

                                        Image not available

                                    </div>

                                `;

                            }



                            productsHTML += `

                                <div class="product">

                                    ${productImageHTML}


                                    <strong>

                                        ${
                                            product.name ||
                                            "Product"
                                        }

                                    </strong>


                                    <p>

                                        Price:
                                        ৳${price}

                                    </p>


                                    <p>

                                        Quantity:
                                        ${quantity}

                                    </p>


                                    <p>

                                        Subtotal:
                                        ৳${subtotal}

                                    </p>

                                </div>

                            `;

                        }

                    );

                }



                /* ==================================================
                   ORDER CARD
                ================================================== */

                ordersHTML += `

                    <div class="order-card">

                        <h2>

                            Order #

                            ${
                                order.orderId ||
                                doc.id
                            }

                        </h2>


                        <p class="order-info">

                            <strong>
                                Date:
                            </strong>

                            ${
                                order.dateTime ||
                                "N/A"
                            }

                        </p>


                        <p class="order-info">

                            <strong>
                                Status:
                            </strong>


                            <span class="status">

                                ${orderStatus}

                            </span>

                        </p>


                        <p class="order-info">

                            <strong>
                                Payment:
                            </strong>

                            ${
                                order.paymentMethod ||
                                "N/A"
                            }

                        </p>


                        <h3>

                            Products

                        </h3>


                        ${productsHTML}


                        <div class="total">

                            Total:

                            ৳${
                                Number(
                                    order.totalAmount
                                ) || 0
                            }

                        </div>


                        <button

                            class="view-details-button"

                            onclick="
                                viewOrderDetails(
                                    '${doc.id}'
                                )
                            "

                        >

                            View Details

                        </button>


                    </div>

                `;

            }

        );



        /* ==================================================
           NO MATCHING ORDERS
        ================================================== */

        if (
            matchingOrders === 0
        ) {

            noOrders.style.display =
                "block";


            if (selectedStatus) {

                noOrdersText.innerText =
                    "You don't have any " +
                    filterTitle.innerText +
                    ".";

            }

            else {

                noOrdersText.innerText =
                    "You haven't placed any orders yet.";

            }


            return;

        }



        /* ==================================================
           SHOW ORDERS
        ================================================== */

        container.innerHTML =
            ordersHTML;

    }

    catch (error) {

        console.error(
            "Load Orders Error:",
            error
        );


        loading.innerText =
            "Unable to load your orders. Please try again.";

    }

}



/* ==================================================
   VIEW ORDER DETAILS
================================================== */

window.viewOrderDetails =
    function(orderId) {

        window.location.href =
            "customer-order-details.html?orderId=" +
            encodeURIComponent(
                orderId
            );

    };



/* ==================================================
   HOME
================================================== */

window.goHome =
    function() {

        window.location.href =
            "index.html";

    };


</script>


</body>
</html>
