<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RK Store - Checkout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .checkout-container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 5px #ccc;
        }
    </style>
</head>

<body>

    <h1>RK Store - Checkout</h1>

    <div class="checkout-container">

        <h2>Customer Information</h2>
<label for="name">Name</label>
<input type="text" id="name" placeholder="Enter your name">

<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter your mobile number">

<label for="address">Address</label>
<textarea id="address" placeholder="Enter your address"></textarea>
<br><br>

<button type="button" onclick="placeOrder()">
    Place Order
</button>
    </div>
<script>
function placeOrder() {
    alert("Place Order function is working!");
    const name = document.getElementById("name").value;
    const mobile = document.getElementById("mobile").value;
    const address = document.getElementById("address").value;

    if (name === "" || mobile === "" || address === "") {
        alert("Please fill in all information.");
        return;
    }

const cart = JSON.parse(localStorage.getItem("cart")) || [];

const order = {
    customerName: name,
    customerMobile: mobile,
    customerAddress: address,
    products: cart
};

localStorage.setItem("order", JSON.stringify(order));
alert(localStorage.getItem("order"));

localStorage.removeItem("cart");

alert("Order placed successfully!");

window.location.href = "index.html";
















</script>
</body>
</html>
