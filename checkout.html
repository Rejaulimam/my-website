<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RK Store - Checkout</title>


<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}


h1 {
    background-color: #ff6600;
    color: white;
    text-align: center;
    padding: 20px;
    margin: 0;
}


.checkout-container {
    width: 90%;
    max-width: 600px;
    margin: 30px auto;
    background-color: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 5px #ccc;
}


.checkout-container label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 18px;
}


.checkout-container input,
.checkout-container textarea,
.checkout-container select {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: white;
}


.checkout-container textarea {
    height: 100px;
    resize: vertical;
}


.checkout-container select:disabled {
    background-color: #eeeeee;
    color: #777;
}


#placeOrderButton {
    margin-top: 15px;
    width: 100%;
    padding: 12px 20px;
    font-size: 16px;
    background-color: #ff6600;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}


#placeOrderButton:disabled {
    background-color: #999;
    cursor: not-allowed;
}


.summary-item {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}


.total {
    text-align: right;
}


#authStatus {
    text-align: center;
    color: #666;
    margin-bottom: 15px;
}


.address-title {
    margin-top: 25px;
    margin-bottom: 5px;
}


.address-note {
    font-size: 13px;
    color: #777;
    margin-top: 8px;
    line-height: 1.5;
}


.location-loading {
    color: #777;
    font-size: 14px;
    margin-top: 8px;
}


</style>

</head>


<body>


<h1>RK Store - Checkout</h1>


<div class="checkout-container">


<div id="authStatus">
    Checking customer login...
</div>


<div id="orderSummary"></div>


<h2>Customer Information</h2>


<label for="name">
    Name
</label>


<input
    type="text"
    id="name"
    placeholder="Enter your name"
>


<label for="mobile">
    Mobile Number
</label>


<input
    type="tel"
    id="mobile"
    placeholder="Enter your mobile number"
>


<!-- =========================================
     DELIVERY ADDRESS
========================================== -->


<h2 class="address-title">
    Delivery Address
</h2>


<label for="division">
    Division
</label>


<select id="division">

    <option value="">
        Select Division
    </option>

</select>


<label for="district">
    District
</label>


<select id="district" disabled>

    <option value="">
        Select District
    </option>

</select>


<label for="upazila">
    Upazila / Thana
</label>


<select id="upazila" disabled>

    <option value="">
        Select Upazila / Thana
    </option>

</select>


<label for="union">
    Union
</label>


<select id="union" disabled>

    <option value="">
        Select Union
    </option>

</select>


<label for="ward">
    Ward
</label>

<select id="ward" disabled>

    <option value="">
        Select Ward
    </option>

</select>

<label for="address">
    Detailed Address
</label>


<textarea
    id="address"
    placeholder="House / Road / Village / Other details"
></textarea>


<div class="address-note">

    Select Division, District, Upazila/Thana,
    Union and Ward, then enter your detailed address.

</div>


<div
    id="locationLoading"
    class="location-loading"
></div>



<!-- =========================================
     PAYMENT
========================================== -->


<label for="paymentMethod">
    Payment Method
</label>


<select id="paymentMethod">

    <option value="cod">
        Cash on Delivery
    </option>

    <option value="bkash">
        bKash
    </option>

    <option value="nagad">
        Nagad
    </option>

</select>


<div
    id="paymentDetails"
    style="display:none;"
>


<div
    id="paymentMessage"
    style="
        background:#fff3cd;
        color:#856404;
        padding:12px;
        border-radius:6px;
        margin-top:10px;
    "
>

    Online payment gateway is not connected yet.

</div>


<label for="paymentNumber">
    Payment Number
</label>


<input
    type="tel"
    id="paymentNumber"
    placeholder="Enter payment number"
>


<label for="transactionId">
    Transaction ID
</label>


<input
    type="text"
    id="transactionId"
    placeholder="Enter Transaction ID"
>


</div>


<button
    type="button"
    id="placeOrderButton"
    onclick="placeOrder()"
>

    Place Order

</button>


</div>



<script type="module">


/* ==================================================
   FIREBASE IMPORT
================================================== */


import {

    initializeApp

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

    getFirestore,
    collection,
    addDoc,
    serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {

    getAuth,
    onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



/* ==================================================
   FIREBASE CONFIG
================================================== */


const firebaseConfig = {

    apiKey:
        "AIzaSyCkBQaphKKz_Wxd1GgKAVoxqR4taKvzdEM",

    authDomain:
        "rk-store-5fb24.firebaseapp.com",

    projectId:
        "rk-store-5fb24",

    storageBucket:
        "rk-store-5fb24.firebasestorage.app",

    messagingSenderId:
        "407275549697",

    appId:
        "1:407275549697:web:41043b49bf7182cecffc00"

};



/* ==================================================
   INITIALIZE FIREBASE
================================================== */


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const auth =
    getAuth(app);



/* ==================================================
   CUSTOMER AUTH
================================================== */


let currentUser = null;


onAuthStateChanged(

    auth,

    function(user) {

        currentUser = user;


        const authStatus =
            document.getElementById(
                "authStatus"
            );


        if (user) {

            authStatus.innerText =
                "Customer logged in: " +
                (
                    user.email ||
                    "Customer"
                );


            authStatus.style.color =
                "green";


            const nameInput =
                document.getElementById(
                    "name"
                );


            if (
                nameInput.value.trim() === "" &&
                user.displayName
            ) {

                nameInput.value =
                    user.displayName;

            }

        }

        else {

            authStatus.innerText =
                "Customer login required.";

            authStatus.style.color =
                "red";

        }

    }

);



/* ==================================================
   ORDER SUMMARY
================================================== */


function showOrderSummary() {


    const cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    const summary =
        document.getElementById(
            "orderSummary"
        );


    if (cart.length === 0) {

        summary.innerHTML =
            "<p>Your cart is empty.</p>";

        return;

    }


    let total = 0;


    let html =
        "<h2>Order Summary</h2>";


    cart.forEach(

        function(product) {

            const quantity =
                Number(product.quantity) || 1;


            const price =
                Number(product.price) || 0;


            const subtotal =
                price * quantity;


            total += subtotal;


            html += `

                <div class="summary-item">

                    <strong>
                        ${product.name}
                    </strong>

                    <p>
                        Price: ৳${price}
                        × ${quantity}
                    </p>

                    <p>
                        Subtotal: ৳${subtotal}
                    </p>

                </div>

            `;

        }

    );


    html += `

        <h2 class="total">
            Total: ৳${total}
        </h2>

    `;


    summary.innerHTML =
        html;

}


showOrderSummary();



/* ==================================================
   BANGLADESH LOCATION DATA
================================================== */


const LOCATION_DATA_URL =

    "https://iqbalhasandev.github.io/bangladesh-geo-json/bangladesh-geo.json";


let locationData = [];


const divisionSelect =
    document.getElementById("division");


const districtSelect =
    document.getElementById("district");


const upazilaSelect =
    document.getElementById("upazila");


const unionSelect =
    document.getElementById("union");


const wardSelect =
    document.getElementById("ward");


const locationLoading =
    document.getElementById(
        "locationLoading"
    );



/* ==================================================
   RESET SELECT
================================================== */


function resetSelect(
    selectElement,
    text
) {

    selectElement.innerHTML =

        `<option value="">
            ${text}
        </option>`;

}



/* ==================================================
   ADD OPTION
================================================== */


function addOption(
    selectElement,
    value,
    text
) {

    const option =
        document.createElement(
            "option"
        );


    option.value =
        value;


    option.textContent =
        text;


    selectElement.appendChild(
        option
    );

}



/* ==================================================
   LOAD LOCATION DATA
================================================== */


async function loadLocationData() {


    try {

        locationLoading.textContent =
            "Loading address list...";


        const response =
            await fetch(
                LOCATION_DATA_URL
            );


        if (!response.ok) {

            throw new Error(
                "Location data could not be loaded."
            );

        }


        locationData =
            await response.json();


        resetSelect(
            divisionSelect,
            "Select Division"
        );


        locationData.forEach(

            function(division, index) {

                addOption(

                    divisionSelect,

                    index,

                    division.bn_name ||
                    division.name

                );

            }

        );


        locationLoading.textContent =
            "";


    }

    catch (error) {

        console.error(
            "Location Data Error:",
            error
        );


        locationLoading.textContent =
            "Address list could not be loaded. Please refresh.";

    }

}


loadLocationData();



/* ==================================================
   DIVISION CHANGE
================================================== */


divisionSelect.addEventListener(

    "change",

    function() {


        resetSelect(
            districtSelect,
            "Select District"
        );


        resetSelect(
            upazilaSelect,
            "Select Upazila / Thana"
        );


        resetSelect(
            unionSelect,
            "Select Union"
        );


        districtSelect.disabled =
            true;


        upazilaSelect.disabled =
            true;


        unionSelect.disabled =
            true;


        if (this.value === "") {

            return;

        }


        const division =
            locationData[
                Number(this.value)
            ];


        if (
            !division ||
            !Array.isArray(
                division.districts
            )
        ) {

            return;

        }


        division.districts.forEach(

            function(district, index) {

                addOption(

                    districtSelect,

                    index,

                    district.bn_name ||
                    district.name

                );

            }

        );


        districtSelect.disabled =
            false;

    }

);



/* ==================================================
   DISTRICT CHANGE
================================================== */


districtSelect.addEventListener(

    "change",

    function() {


        resetSelect(
            upazilaSelect,
            "Select Upazila / Thana"
        );


        resetSelect(
            unionSelect,
            "Select Union"
        );


        upazilaSelect.disabled =
            true;


        unionSelect.disabled =
            true;


        if (this.value === "") {

            return;

        }


        const division =
            locationData[
                Number(
                    divisionSelect.value
                )
            ];


        if (!division) {

            return;

        }


        const district =
            division.districts[
                Number(this.value)
            ];


        if (
            !district ||
            !Array.isArray(
                district.upazilas
            )
        ) {

            return;

        }


        district.upazilas.forEach(

            function(upazila, index) {

                addOption(

                    upazilaSelect,

                    index,

                    upazila.bn_name ||
                    upazila.name

                );

            }

        );


        upazilaSelect.disabled =
            false;

    }

);



/* ==================================================
   UPAZILA CHANGE
================================================== */


upazilaSelect.addEventListener(

    "change",

    function() {


        resetSelect(
            unionSelect,
            "Select Union"
        );


        unionSelect.disabled =
            true;


        if (this.value === "") {

            return;

        }


        const division =
            locationData[
                Number(
                    divisionSelect.value
                )
            ];


        if (!division) {

            return;

        }


        const district =
            division.districts[
                Number(
                    districtSelect.value
                )
            ];


        if (!district) {

            return;

        }


        const upazila =
            district.upazilas[
                Number(this.value)
            ];


        if (
            !upazila ||
            !Array.isArray(
                upazila.unions
            )
        ) {

            return;

        }


        upazila.unions.forEach(

            function(union, index) {

                addOption(

                    unionSelect,

                    index,

                    union.bn_name ||
                    union.name

                );

            }

        );


        unionSelect.disabled =
            false;

    }

);



/* ==================================================
   PAYMENT METHOD
================================================== */


document
    .getElementById("paymentMethod")
    .addEventListener(

        "change",

        function() {


            const paymentDetails =
                document.getElementById(
                    "paymentDetails"
                );


            if (
                this.value === "bkash" ||
                this.value === "nagad"
            ) {

                paymentDetails.style.display =
                    "block";

            }

            else {

                paymentDetails.style.display =
                    "none";

            }

        }

    );



/* ==================================================
   PLACE ORDER
================================================== */


window.placeOrder =

async function() {


    const button =
        document.getElementById(
            "placeOrderButton"
        );


    const user =
        auth.currentUser;


    /* =========================================
       LOGIN CHECK
    ========================================== */


    if (!user) {

        alert(
            "Please login to your customer account first."
        );


        window.location.href =
            "customer-login.html";


        return;

    }


    currentUser =
        user;



    /* =========================================
       CUSTOMER INFORMATION
    ========================================== */


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const mobile =
        document
            .getElementById("mobile")
            .value
            .trim();



    /* =========================================
       ADDRESS VALUES
    ========================================== */


    const divisionValue =
        divisionSelect.value;


    const districtValue =
        districtSelect.value;


    const upazilaValue =
        upazilaSelect.value;


    const unionValue =
        unionSelect.value;


    const wardValue =
        wardSelect.value;


    const detailedAddress =
        document
            .getElementById("address")
            .value
            .trim();



    /* =========================================
       ADDRESS NAMES
    ========================================== */


    let divisionName = "";

    let districtName = "";

    let upazilaName = "";

    let unionName = "";


    if (divisionValue !== "") {


        const division =
            locationData[
                Number(divisionValue)
            ];


        if (division) {


            divisionName =
                division.bn_name ||
                division.name;


            if (
                districtValue !== "" &&
                division.districts
            ) {


                const district =
                    division.districts[
                        Number(districtValue)
                    ];


                if (district) {


                    districtName =
                        district.bn_name ||
                        district.name;


                    if (
                        upazilaValue !== "" &&
                        district.upazilas
                    ) {


                        const upazila =
                            district.upazilas[
                                Number(upazilaValue)
                            ];


                        if (upazila) {


                            upazilaName =
                                upazila.bn_name ||
                                upazila.name;


                            if (
                                unionValue !== "" &&
                                upazila.unions
                            ) {


                                const union =
                                    upazila.unions[
                                        Number(unionValue)
                                    ];


                                if (union) {

                                    unionName =
                                        union.bn_name ||
                                        union.name;

                                }

                            }

                        }

                    }

                }

            }

        }

    }



    /* =========================================
       PAYMENT
    ========================================== */


    const paymentMethod =
        document
            .getElementById(
                "paymentMethod"
            )
            .value;


    const paymentNumber =
        document
            .getElementById(
                "paymentNumber"
            )
            .value
            .trim();


    const transactionId =
        document
            .getElementById(
                "transactionId"
            )
            .value
            .trim();



    /* =========================================
       VALIDATION
    ========================================== */


    if (

        name === "" ||

        mobile === "" ||

        divisionValue === "" ||

        districtValue === "" ||

        upazilaValue === "" ||

        unionValue === "" ||

        wardValue === "" ||

        detailedAddress === ""

    ) {

        alert(
            "Please fill in all customer and delivery address information."
        );

        return;

    }



    /* =========================================
       PAYMENT VALIDATION
    ========================================== */


    if (
        paymentMethod === "bkash" ||
        paymentMethod === "nagad"
    ) {

        alert(
            "Online payment is not available yet. Please select Cash on Delivery."
        );

        return;

    }



    /* =========================================
       CART
    ========================================== */


    const cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }



    /* =========================================
       TOTAL
    ========================================== */


    let totalAmount = 0;


    cart.forEach(

        function(product) {


            const quantity =
                Number(
                    product.quantity
                ) || 1;


            const price =
                Number(
                    product.price
                ) || 0;


            totalAmount +=
                price * quantity;

        }

    );



    /* =========================================
       ORDER ID
    ========================================== */


    const orderId =
        "RK-" + Date.now();



    /* =========================================
       FULL ADDRESS
    ========================================== */


    const fullAddress =

        "Division: " +
        divisionName +

        ", District: " +
        districtName +

        ", Upazila/Thana: " +
        upazilaName +

        ", Union: " +
        unionName +

        ", Ward: " +
        wardValue +

        ", Details: " +
        detailedAddress;



    /* =========================================
       ORDER DATA
    ========================================== */


    const order = {


        orderId:
            orderId,


        customerId:
            currentUser.uid,


        customerEmail:
            currentUser.email || "",


        customerName:
            name,


        customerMobile:
            mobile,


        /* OLD FIELD */

        customerAddress:
            fullAddress,


        /* NEW ADDRESS FIELDS */

        division:
            divisionName,


        district:
            districtName,


        upazila:
            upazilaName,


        unionArea:
            unionName,


        ward:
            wardValue,


        detailedAddress:
            detailedAddress,


        paymentMethod:
            paymentMethod,


        paymentNumber:
            paymentNumber,


        transactionId:
            transactionId,


        products:
            cart,


        totalAmount:
            totalAmount,


        status:
            "Pending",


        dateTime:
            new Date().toLocaleString(),


        createdAt:
            serverTimestamp()

    };



    /* =========================================
       BUTTON LOCK
    ========================================== */


    button.disabled =
        true;


    button.innerText =
        "Placing Order...";



    /* =========================================
       FIRESTORE SAVE
    ========================================== */


    try {


        const docRef =

            await addDoc(

                collection(
                    db,
                    "orders"
                ),

                order

            );


        console.log(
            "Order saved:",
            docRef.id
        );



        /* =====================================
           LOCAL COPY
        ====================================== */


        let orders =

            JSON.parse(

                localStorage.getItem(
                    "orders"
                )

            ) || [];


        orders.push({

            ...order,

            firebaseId:
                docRef.id,

            createdAt:
                new Date().toISOString()

        });


        localStorage.setItem(

            "orders",

            JSON.stringify(
                orders
            )

        );



        /* =====================================
           CLEAR CART
        ====================================== */


        localStorage.removeItem(
            "cart"
        );



        /* =====================================
           SUCCESS
        ====================================== */


        alert(
            "Order placed successfully!"
        );


        window.location.href =
            "index.html";


    }


    catch (error) {


        console.error(
            "Firebase Order Error:",
            error
        );


        alert(
            "Order could not be placed. Please try again."
        );


        button.disabled =
            false;


        button.innerText =
            "Place Order";

    }

};


</script>


</body>

</html>
