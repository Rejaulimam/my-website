<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RK Store - Checkout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .checkout-container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 5px #ccc;
        }
.checkout-container label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 18px;
}

.checkout-container input,
.checkout-container textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
}

.checkout-container textarea {
    height: 100px;
}

#placeOrderButton {
    margin-top: 15px;
    padding: 10px 18px;
    font-size: 16px;
}
    </style>
</head>

<body>

    <h1>RK Store - Checkout</h1>

    <div class="checkout-container">

        <h2>Customer Information</h2>
<label for="name">Name</label>
<input type="text" id="name" placeholder="Enter your name">

<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter your mobile number">

<label for="address">Address</label>
<textarea id="address" placeholder="Enter your address"></textarea>
<br><br>

<button type="button" id="placeOrderButton" onclick="placeOrder()">
    Place Order
</button>

    </div>
<script>
function placeOrder() {
    const name = document.getElementById("name").value;
    const mobile = document.getElementById("mobile").value;
    const address = document.getElementById("address").value;

    if (name === "" || mobile === "" || address === "") {
        alert("Please fill in all information.");
        return;
    }

    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    const order = {
        customerName: name,
        customerMobile: mobile,
        customerAddress: address,
        products: cart
    };
let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push(order);

localStorage.setItem("orders", JSON.stringify(orders));
    

    localStorage.removeItem("cart");

    alert("Order placed successfully!");

    window.location.href = "orders.html";
}


</script>
</body>
</html>
