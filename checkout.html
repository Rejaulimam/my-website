let currentUser = null;


onAuthStateChanged(

    function(user) {

/* ==================================================
   ORDER SUMMARY
================================================== */


function showOrderSummary() {


    const cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    const summary =
        document.getElementById(
            "orderSummary"
        );


    if (cart.length === 0) {

        summary.innerHTML =
            "<p>Your cart is empty.</p>";

        return;

    }


    let total = 0;


    let html =
        "<h2>Order Summary</h2>";


    cart.forEach(

        function(product) {

            const quantity =
                Number(product.quantity) || 1;


            const price =
                Number(product.price) || 0;


            const subtotal =
                price * quantity;


            total += subtotal;


            html += `

                <div class="summary-item">

                    <strong>
                        ${product.name}
                    </strong>

                    <p>
                        Price: ৳${price}
                        × ${quantity}
                    </p>

                    <p>
                        Subtotal: ৳${subtotal}
                    </p>

                </div>

            `;

        }

    );


    html += `

        <h2 class="total">
            Total: ৳${total}
        </h2>

    `;


    summary.innerHTML =
        html;

}


showOrderSummary();



/* ==================================================
   BANGLADESH LOCATION DATA
================================================== */


const LOCATION_DATA_URL =

    "https://iqbalhasandev.github.io/bangladesh-geo-json/bangladesh-geo.json";


let locationData = [];


const divisionSelect =
    document.getElementById("division");


const districtSelect =
    document.getElementById("district");


const upazilaSelect =
    document.getElementById("upazila");


const unionSelect =
    document.getElementById("union");


const wardSelect =
    document.getElementById("ward");


const locationLoading =
    document.getElementById(
        "locationLoading"
    );



/* ==================================================
   RESET SELECT
================================================== */


function resetSelect(
    selectElement,
    text
) {

    selectElement.innerHTML =

        `<option value="">
            ${text}
        </option>`;

}



/* ==================================================
   ADD OPTION
================================================== */


function addOption(
    selectElement,
    value,
    text
) {

    const option =
        document.createElement(
            "option"
        );


    option.value =
        value;


    option.textContent =
        text;


    selectElement.appendChild(
        option
    );

}



/* ==================================================
   LOAD LOCATION DATA
================================================== */


async function loadLocationData() {


    try {

        locationLoading.textContent =
            "Loading address list...";


        const response =
            await fetch(
                LOCATION_DATA_URL
            );


        if (!response.ok) {

            throw new Error(
                "Location data could not be loaded."
            );

        }


        locationData =
            await response.json();


        resetSelect(
            divisionSelect,
            "Select Division"
        );


        locationData.forEach(

            function(division, index) {

                addOption(

                    divisionSelect,

                    index,

                    division.bn_name ||
                    division.name

                );

            }

        );


        locationLoading.textContent =
            "";


    }

    catch (error) {

        console.error(
            "Location Data Error:",
            error
        );


        locationLoading.textContent =
            "Address list could not be loaded. Please refresh.";

    }

}


loadLocationData();



/* ==================================================
   DIVISION CHANGE
================================================== */


divisionSelect.addEventListener(

    "change",

    function() {

        resetSelect(
            districtSelect,
            "Select District"
        );

        resetSelect(
            upazilaSelect,
            "Select Upazila / Thana"
        );

        resetSelect(
            unionSelect,
            "Select Union"
        );

        districtSelect.disabled = true;
        upazilaSelect.disabled = true;
        unionSelect.disabled = true;

        if (this.value === "") {
            return;
        }

        const division =
            locationData[
                Number(this.value)
            ];

        if (!division) {
            console.log("Division not found");
            return;
        }

        const districts =
            division.districts ||
            division.district ||
            division.children;

        if (!Array.isArray(districts)) {

            console.log(
                "District data not found:",
                division
            );

            return;
        }

        districts.forEach(

            function(district, index) {

                addOption(

                    districtSelect,

                    index,

                    district.bn_name ||
                    district.name ||
                    district.district_name

                );

            }

        );

        districtSelect.disabled = false;

    }

);



/* ==================================================
   DISTRICT CHANGE
================================================== */


districtSelect.addEventListener(

    "change",

    function() {

        resetSelect(
            upazilaSelect,
            "Select Upazila / Thana"
        );

        resetSelect(
            unionSelect,
            "Select Union"
        );

        upazilaSelect.disabled = true;
        unionSelect.disabled = true;

        if (this.value === "") {
            return;
        }

        const division =
            locationData[
                Number(divisionSelect.value)
            ];

        if (!division) {
            return;
        }

        const districts =
            division.districts ||
            division.district ||
            division.children;

        if (!Array.isArray(districts)) {
            return;
        }

        const district =
            districts[
                Number(this.value)
            ];

        if (!district) {
            return;
        }

        const upazilas =
            district.upazilas ||
            district.upazila ||
            district.children;

        if (!Array.isArray(upazilas)) {

            console.log(
                "Upazila data not found:",
                district
            );

            return;

        }

        upazilas.forEach(

            function(upazila, index) {

                addOption(

                    upazilaSelect,

                    index,

                    upazila.bn_name ||
                    upazila.name ||
                    upazila.upazila_name

                );

            }

        );

        upazilaSelect.disabled = false;

    }

);



/* ==================================================
   UPAZILA CHANGE
================================================== */


upazilaSelect.addEventListener(

    "change",

    function() {

        resetSelect(
            unionSelect,
            "Select Union"
        );


        unionSelect.disabled =
            true;


        if (this.value === "") {

            return;

        }


        const division =
            locationData[
                Number(
                    divisionSelect.value
                )
            ];


        if (!division) {

            return;

        }


        const districts =
            division.districts ||
            division.district ||
            division.children;


        const district =
            districts[
                Number(
                    districtSelect.value
                )
            ];


        if (!district) {

            return;

        }


        const upazilas =
            district.upazilas ||
            district.upazila ||
            district.children;


        const upazila =
            upazilas[
                Number(this.value)
            ];


        if (
            !upazila ||
            !Array.isArray(
                upazila.unions
            )
        ) {

            return;

        }


        upazila.unions.forEach(

            function(union, index) {

                addOption(

                    unionSelect,

                    index,

                    union.bn_name ||
                    union.name

                );

            }

        );


        unionSelect.disabled =
            false;

    }

);



/* ==================================================
   PAYMENT METHOD
================================================== */

document
.getElementById("paymentMethod")
.addEventListener(

    "change",

    function() {

        const paymentDetails =
            document.getElementById(
                "paymentDetails"
            );

        const paymentMessage =
            document.getElementById(
                "paymentMessage"
            );

            );

            );

           CASH ON DELIVERY
        ============================== */

        if (this.value === "cod") {

            paymentDetails.style.display =

            paymentNumber.value = "";
            transactionId.value = "";

            return;

        }


        /* ==============================
           ONLINE PAYMENT DETAILS
        ============================== */

        paymentDetails.style.display =
            "block";


        /* ==============================
           BKASH
        ============================== */

        if (this.value === "bkash") {

            paymentMessage.innerHTML =

            paymentNumber.placeholder =

            transactionId.placeholder =
                "Enter bKash Transaction ID";

            return;

        }

           NAGAD

        if (this.value === "nagad") {

            paymentMessage.innerHTML =
                "<strong>Nagad</strong><br>" +

                "Please use Cash on Delivery.";

            paymentNumber.placeholder =
                "Enter Nagad number";

            transactionId.placeholder =
                "Enter Nagad Transaction ID";

            return;

        }


        /* ==============================
           ROCKET
        ============================== */

        if (this.value === "rocket") {

            paymentMessage.innerHTML =
                "<strong>Rocket</strong><br>" +
                "Online Rocket payment gateway is not connected yet. " +
                "Please use Cash on Delivery.";

            paymentNumber.placeholder =
                "Enter Rocket number";

            transactionId.placeholder =
                "Enter Rocket Transaction ID";

            return;

        }

           BANK TRANSFER
        ============================== */

        if (this.value === "bank") {

            paymentMessage.innerHTML =

            paymentNumber.placeholder =
                "Enter bank account / sender number";

            transactionId.placeholder =
                "Enter Bank Transaction ID";

            return;

        }


        /* ==============================
           VISA / MASTERCARD
        ============================== */

        if (this.value === "card") {

            paymentMessage.innerHTML =
                "<strong>Visa / Mastercard</strong><br>" +
                "Card payment gateway is not connected yet. " +
                "Please use Cash on Delivery.";

            paymentNumber.placeholder =
                "Enter payment reference";

            transactionId.placeholder =
                "Enter Transaction ID";

            return;

        }

    }

);




/* ==================================================
   PLACE ORDER
================================================== */


window.placeOrder =

async function() {


    const button =
        document.getElementById(
            "placeOrderButton"
        );


    const user =
        auth.currentUser;



    /* =========================================
       LOGIN CHECK
    ========================================== */


    if (!user) {

        alert(
            "Please login to your customer account first."
        );


        window.location.href =
            "customer-login.html";


        return;

    }


    currentUser =
        user;



    /* =========================================
       CUSTOMER INFORMATION
    ========================================== */


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const mobile =
        document
            .getElementById("mobile")
            .value
            .trim();



    /* =========================================
       ADDRESS VALUES
    ========================================== */


    const divisionValue =
        divisionSelect.value;


    const districtValue =
        districtSelect.value;


    const upazilaValue =
        upazilaSelect.value;


    const unionValue =
        unionSelect.value;


    const wardValue =
        wardSelect.value;


    const detailedAddress =
        document
            .getElementById("address")
            .value
            .trim();



    /* =========================================
       ADDRESS NAMES
    ========================================== */


    let divisionName = "";

    let districtName = "";

    let upazilaName = "";

    let unionName = "";


    if (divisionValue !== "") {

        const division =
            locationData[
                Number(divisionValue)
            ];


        if (division) {

            divisionName =
                division.bn_name ||
                division.name;


            const districts =
                division.districts ||
                division.district ||
                division.children;


            if (
                districtValue !== "" &&
                Array.isArray(districts)
            ) {

                const district =
                    districts[
                        Number(districtValue)
                    ];


                if (district) {

                    districtName =
                        district.bn_name ||
                        district.name ||
                        district.district_name;


                    const upazilas =
                        district.upazilas ||
                        district.upazila ||
                        district.children;


                    if (
                        upazilaValue !== "" &&
                        Array.isArray(upazilas)
                    ) {

                        const upazila =
                            upazilas[
                                Number(upazilaValue)
                            ];


                        if (upazila) {

                            upazilaName =
                                upazila.bn_name ||
                                upazila.name ||
                                upazila.upazila_name;


                            if (
                                unionValue !== "" &&
                                Array.isArray(
                                    upazila.unions
                                )
                            ) {

                                const union =
                                    upazila.unions[
                                        Number(unionValue)
                                    ];


                                if (union) {

                                    unionName =
                                        union.bn_name ||
                                        union.name;

                                }

                            }

                        }

                    }

                }

            }

        }

    }



    /* =========================================
       PAYMENT
    ========================================== */


    const paymentMethod =
        document
            .getElementById(
                "paymentMethod"
            )
            .value;


    const paymentNumber =
        document
            .getElementById(
                "paymentNumber"
            )
            .value
            .trim();


    const transactionId =
        document
            .getElementById(
                "transactionId"
            )
            .value
            .trim();



    /* =========================================
       VALIDATION
    ========================================== */


    if (

        name === "" ||

        mobile === "" ||

        divisionValue === "" ||

        districtValue === "" ||

        upazilaValue === "" ||

        unionValue === "" ||

        wardValue === "" ||

        detailedAddress === ""

    ) {

        alert(
            "Please fill in all customer and delivery address information."
        );

        return;

    }



    /* =====================================
   PAYMENT VALIDATION
===================================== */

if (
    paymentMethod !== "cod"
) {

    alert(
        "This payment method is not available yet. Please select Cash on Delivery."
    );

    return;

}



    /* =========================================
       CART
    ========================================== */


    const cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }



    /* =========================================
       CHECK CART QUANTITY
    ========================================== */

    for (
        const product
        of cart
    ) {

        const quantity =
            Number(product.quantity);


        if (
            !Number.isFinite(quantity) ||
            quantity <= 0
        ) {

            alert(
                product.name +
                " has an invalid quantity."
            );

            return;

        }

    }



    /* =========================================
       TOTAL
    ========================================== */


    let totalAmount = 0;


    cart.forEach(

        function(product) {

            const quantity =
                Number(
                    product.quantity
                ) || 1;


            const price =
                Number(
                    product.price
                ) || 0;


            totalAmount +=
                price * quantity;

        }

    );



    /* =========================================
       ORDER ID
    ========================================== */


    const orderId =
        "RK-" + Date.now();



    /* =========================================
       FULL ADDRESS
    ========================================== */


    const fullAddress =

        "Division: " +
        divisionName +

        ", District: " +
        districtName +

        ", Upazila/Thana: " +
        upazilaName +

        ", Union: " +
        unionName +

        ", Ward: " +
        wardValue +

        ", Details: " +
        detailedAddress;



    /* =========================================
       ORDER DATA
    ========================================== */


    const order = {

        orderId:
            orderId,


        customerId:
            currentUser.uid,


        customerEmail:
            currentUser.email || "",


        customerName:
            name,


        customerMobile:
            mobile,


        /* OLD FIELD */

        customerAddress:
            fullAddress,


        /* NEW ADDRESS FIELDS */

        division:
            divisionName,


        district:
            districtName,


        upazila:
            upazilaName,


        unionArea:
            unionName,


        ward:
            wardValue,


        detailedAddress:
            detailedAddress,


        paymentMethod:
            paymentMethod,


        paymentNumber:
            paymentNumber,


        transactionId:
            transactionId,


        products:
    cart.map(function(product) {

        return {

            ...product,

            productSerial:
                product.productSerial ||
                product.productId

        };

    }),

        totalAmount:
            totalAmount,


        status:
            "Pending",


        dateTime:
            new Date().toLocaleString(),


        createdAt:
            serverTimestamp()

    };



    /* =========================================
       BUTTON LOCK
    ========================================== */


    button.disabled =
        true;


    button.innerText =
        "Checking Stock...";



    /* =========================================
       FIREBASE TRANSACTION
       ORDER + STOCK UPDATE
    ========================================== */

    try {


        const docRef =

            await runTransaction(

                db,

                async function(transaction) {


                    /*
                     * এখানে সব product-এর
                     * সর্বশেষ Firebase stock
                     * আগে পড়া হবে।
                     */

                    const stockItems = [];


                    for (
                        const product
                        of cart
                    ) {


                        const productId =
                            String(
                                product.productId
                            );


                        const quantity =
                            Number(
                                product.quantity
                            );


                        if (
                            !productId
                        ) {

                            throw new Error(
                                "INVALID_PRODUCT_ID|" +
                                product.name
                            );

                        }


                        const productRef =
                            doc(
                                db,
                                "productDescriptions",
                                productId
                            );


                        const productSnapshot =
                            await transaction.get(
                                productRef
                            );


                        if (
                            !productSnapshot.exists()
                        ) {

                            throw new Error(
                                "PRODUCT_NOT_FOUND|" +
                                product.name
                            );

                        }


                        const productData =
                            productSnapshot.data();


                        const currentStock =
                            Number(
                                productData.stock
                            );


                        if (
                            !Number.isFinite(
                                currentStock
                            ) ||
                            currentStock < 0
                        ) {

                            throw new Error(
                                "INVALID_STOCK|" +
                                product.name
                            );

                        }


                        /*
                         * আসল Stock Protection
                         */

                        if (
                            quantity >
                            currentStock
                        ) {

                            throw new Error(

                                "STOCK_NOT_ENOUGH|" +

                                product.name +

                                "|" +

                                currentStock

                            );

                        }


                        stockItems.push({

                            ref:
                                productRef,

                            currentStock:
                                currentStock,

                            quantity:
                                quantity

                        });

                    }



                    /*
                     * ==================================
                     * STOCK UPDATE
                     * ==================================
                     */

                    for (
                        const item
                        of stockItems
                    ) {


                        const newStock =

                            item.currentStock -
                            item.quantity;


                        transaction.update(

                            item.ref,

                            {
                                stock:
                                    newStock
                            }

                        );

                    }



                    /*
                     * ==================================
                     * CREATE ORDER DOCUMENT
                     * ==================================
                     */

                    const orderRef =
                        doc(
                            collection(
                                db,
                                "orders"
                            )
                        );


                    transaction.set(

                        orderRef,

                        order

                    );


                    return orderRef;

                }

            );


        console.log(
            "Order saved:",
            docRef.id
        );



        /* =====================================
           LOCAL COPY
        ====================================== */


        let orders =

            JSON.parse(

                localStorage.getItem(
                    "orders"
                )

            ) || [];


        orders.push({

            ...order,

            firebaseId:
                docRef.id,

            createdAt:
                new Date().toISOString()

        });


        localStorage.setItem(

            "orders",

            JSON.stringify(
                orders
            )

        );



        /* =====================================
           CLEAR CART
        ====================================== */


        localStorage.removeItem(
            "cart"
        );



        /* =====================================
           SUCCESS
        ====================================== */


        alert(
            "Order placed successfully!"
        );


        window.location.href =
            "index.html";


    }


    catch (error) {


        console.error(
            "Firebase Order Error:",
            error
        );


        /* =====================================
           STOCK ERROR
        ====================================== */

        if (
            error.message &&
            error.message.startsWith(
                "STOCK_NOT_ENOUGH|"
            )
        ) {


            const parts =
                error.message.split("|");


            const productName =
                parts[1] ||
                "Product";


            const availableStock =
                parts[2] ||
                "0";


            alert(

                productName +

                " has only " +

                availableStock +

                " pcs in stock. " +

                "Please reduce the quantity."

            );


            button.disabled =
                false;


            button.innerText =
                "Place Order";


            return;

        }



        /* =====================================
           PRODUCT NOT FOUND
        ====================================== */

        if (
            error.message &&
            error.message.startsWith(
                "PRODUCT_NOT_FOUND|"
            )
        ) {


            const parts =
                error.message.split("|");


            const productName =
                parts[1] ||
                "Product";


            alert(

                productName +

                " product information was not found."

            );


            button.disabled =
                false;


            button.innerText =
                "Place Order";


            return;

        }



        /* =====================================
           INVALID STOCK
        ====================================== */

        if (
            error.message &&
            error.message.startsWith(
                "INVALID_STOCK|"
            )
        ) {


            const parts =
                error.message.split("|");


            const productName =
                parts[1] ||
                "Product";


            alert(

                productName +

                " stock information is invalid."

            );


            button.disabled =
                false;


            button.innerText =
                "Place Order";


            return;

        }



        /* =====================================
           GENERAL ERROR
        ====================================== */

        console.error(
    "Firebase Error Code:",
    error.code
);

console.error(
    "Firebase Error Message:",
    error.message
);

alert(
    "Order Error: " +
    (error.code || "Unknown") +
    "\n\n" +
    (error.message || "Unknown error")
);

button.disabled =
    false;

button.innerText =
    "Place Order";

    }

};


</script>


</body>

</html>
