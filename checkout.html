<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RK Store - Checkout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            background-color: #ff6600;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .checkout-container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 5px #ccc;
        }

        .checkout-container label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .checkout-container input,
        .checkout-container textarea,
        .checkout-container select {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .checkout-container textarea {
            height: 100px;
        }

        #placeOrderButton {
            margin-top: 15px;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #ff6600;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #placeOrderButton:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .summary-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .total {
            text-align: right;
        }
    </style>
</head>

<body>

    <h1>RK Store - Checkout</h1>

    <div class="checkout-container">

        <div id="orderSummary"></div>

        <h2>Customer Information</h2>

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <label for="mobile">Mobile Number</label>
        <input
            type="tel"
            id="mobile"
            placeholder="Enter your mobile number"
        >

        <label for="address">Address</label>
        <textarea
            id="address"
            placeholder="Enter your address"
        ></textarea>

        <label for="paymentMethod">Payment Method</label>

        <select id="paymentMethod">
            <option value="cod">Cash on Delivery</option>
            <option value="bkash">bKash</option>
            <option value="nagad">Nagad</option>
        </select>

        <div id="paymentDetails" style="display:none;">

            <label for="paymentNumber">
                Payment Number
            </label>

            <input
                type="tel"
                id="paymentNumber"
                placeholder="Enter bKash/Nagad number"
            >

            <label for="transactionId">
                Transaction ID
            </label>

            <input
                type="text"
                id="transactionId"
                placeholder="Enter Transaction ID"
            >

        </div>

        <button
            type="button"
            id="placeOrderButton"
            onclick="placeOrder()"
        >
            Place Order
        </button>

    </div>


<script type="module">

    /* =========================
       FIREBASE
    ========================= */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {

        apiKey: "AIzaSyCkBQaphKKz_WxdGgKAVoxqR4taKvzdEM",

        authDomain:
            "rk-store-5fb24.firebaseapp.com",

        projectId:
            "rk-store-5fb24",

        storageBucket:
            "rk-store-5fb24.firebasestorage.app",

        messagingSenderId:
            "407275549697",

        appId:
            "1:407275549697:web:41043b49bf7182cecffc00"
    };


    const app =
        initializeApp(firebaseConfig);

    const db =
        getFirestore(app);

const auth =
    getAuth(app);

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

let currentUser = null;

onAuthStateChanged(auth, function(user) {
    currentUser = user;
});
    /* =========================
       ORDER SUMMARY
    ========================= */

    function showOrderSummary() {

        const cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        const summary =
            document.getElementById(
                "orderSummary"
            );


        if (cart.length === 0) {

            summary.innerHTML =
                "<p>Your cart is empty.</p>";

            return;
        }


        let total = 0;

        let html =
            "<h2>Order Summary</h2>";


        cart.forEach(function(product) {

            const quantity =
                Number(product.quantity) || 1;

            const price =
                Number(product.price) || 0;

            const subtotal =
                price * quantity;

            total += subtotal;


            html += `

                <div class="summary-item">

                    <strong>
                        ${product.name}
                    </strong>

                    <p>
                        Price: ৳${price}
                        × ${quantity}
                    </p>

                    <p>
                        Subtotal: ৳${subtotal}
                    </p>

                </div>

            `;
        });


        html += `

            <h2 class="total">
                Total: ৳${total}
            </h2>

        `;


        summary.innerHTML = html;
    }


    showOrderSummary();


    /* =========================
       PAYMENT METHOD
    ========================= */

    document
        .getElementById("paymentMethod")
        .addEventListener(
            "change",
            function() {

                const paymentDetails =
                    document.getElementById(
                        "paymentDetails"
                    );


                if (
                    this.value === "bkash" ||
                    this.value === "nagad"
                ) {

                    paymentDetails.style.display =
                        "block";

                } else {

                    paymentDetails.style.display =
                        "none";
                }

            }
        );


    /* =========================
       PLACE ORDER
    ========================= */

    window.placeOrder = async function() {

        const button =
            document.getElementById(
                "placeOrderButton"
            );


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const mobile =
            document
                .getElementById("mobile")
                .value
                .trim();


        const address =
            document
                .getElementById("address")
                .value
                .trim();


        const paymentMethod =
            document
                .getElementById("paymentMethod")
                .value;


        const paymentNumber =
            document
                .getElementById("paymentNumber")
                .value
                .trim();


        const transactionId =
            document
                .getElementById("transactionId")
                .value
                .trim();


        /* =========================
           VALIDATION
        ========================= */

        if (
            name === "" ||
            mobile === "" ||
            address === ""
        ) {

            alert(
                "Please fill in all information."
            );

            return;
        }


        if (
            paymentMethod === "bkash" ||
            paymentMethod === "nagad"
        ) {

            if (
                paymentNumber === "" ||
                transactionId === ""
            ) {

                alert(
                    "Please enter Payment Number and Transaction ID."
                );

                return;
            }
        }


        const cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        if (cart.length === 0) {

            alert("Your cart is empty.");

            return;
        }


        /* =========================
           TOTAL
        ========================= */

        let totalAmount = 0;


        cart.forEach(function(product) {

            const quantity =
                Number(product.quantity) || 1;

            const price =
                Number(product.price) || 0;

            totalAmount +=
                price * quantity;

        });


        /* =========================
           ORDER ID
        ========================= */

        const orderId =
            "RK-" + Date.now();


        /* =========================
           ORDER DATA
        ========================= */

        const user = auth.currentUser;

if (!user) {

    alert("Customer login session not found. Please login again.");

    return;
}


const order = {

    orderId: orderId,

    customerId:
        user.uid,

    customerEmail:
        user.email || "",

    customerName: name,

    customerMobile: mobile,

    customerAddress: address,

    paymentMethod: paymentMethod,

    paymentNumber:
        paymentNumber,

    transactionId:
        transactionId,

    products: cart,

    totalAmount:
        totalAmount,

    status: "Pending",

    dateTime:
        new Date().toLocaleString(),

    createdAt:
        serverTimestamp()

};

        /* =========================
           BUTTON LOCK
        ========================= */

        button.disabled = true;

        button.innerText =
            "Placing Order...";


        try {

            /* =========================
               FIRESTORE SAVE
            ========================= */

            const docRef =
                await addDoc(
                    collection(db, "orders"),
                    order
                );


            /* =========================
               LOCAL STORAGE
               FOR CURRENT WEBSITE
            ========================= */

            let orders =
                JSON.parse(
                    localStorage.getItem(
                        "orders"
                    )
                ) || [];


            orders.push({

                ...order,

                firebaseId:
                    docRef.id,

                createdAt:
                    new Date().toISOString()

            });


            localStorage.setItem(
                "orders",
                JSON.stringify(orders)
            );


            /* =========================
               CLEAR CART
            ========================= */

            localStorage.removeItem(
                "cart"
            );


            alert(
                "Order placed successfully!"
            );


            window.location.href =
                "orders.html";


        } catch (error) {

            console.error(
                "Firebase Error:",
                error
            );


            alert(
                "Order could not be placed. Please try again."
            );


            button.disabled = false;

            button.innerText =
                "Place Order";
        }

    };

</script>

</body>
</html>
